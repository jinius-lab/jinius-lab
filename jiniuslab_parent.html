  <!-- 링크 미리보기(카톡·문자 등)에 뜨는 이미지·제목. 없으면 페이지 안 이미지를 아무거나 집어간다. -->

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, set, get as __rawGet, onValue as __rawOnValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  /* ── Firebase에서 읽는 모든 데이터를 NFC로 정규화 (한글 자모 분리 방지) ── */
  const __nfcDeep = (v) => {
    if (typeof v === 'string') { try { return v.normalize('NFC'); } catch(e) { return v; } }
    if (Array.isArray(v)) return v.map(__nfcDeep);
    if (v && typeof v === 'object') { const o = {}; for (const k in v) if (Object.prototype.hasOwnProperty.call(v,k)) o[k] = __nfcDeep(v[k]); return o; }
    return v;
  };
  const __wrapSnap = (snap) => ({ exists: () => snap.exists(), val: () => __nfcDeep(snap.val()), key: snap.key });
  const get = (r) => __rawGet(r).then(__wrapSnap);
  const onValue = (r, cb, ...rest) => __rawOnValue(r, (snap) => cb(__wrapSnap(snap)), ...rest);

  const config = {
    apiKey: "AIzaSyDXkvUyGbcs75dRKz7uVPgNclXlw4FLC8M",
    authDomain: "planner-bc65f.firebaseapp.com",
    databaseURL: "https://planner-bc65f-default-rtdb.firebaseio.com",
    projectId: "planner-bc65f",
    storageBucket: "planner-bc65f.firebasestorage.app",
    messagingSenderId: "270893818710",
    appId: "1:270893818710:web:39d9f7a3bf7d5dace6acf7"
  };

  const app = initializeApp(config, "parent-view");
  const db = getDatabase(app);

  /* ── 익명 로그인 ──
     서버가 이 기기에 고유 번호(uid)를 하나 발급한다.
     그 번호를 학생·원장과 연결해 두면, 서버가 «누가 요청했는지» 알 수 있어
     본인 것만 내보낼 수 있다. 애들은 아무것도 더 입력하지 않는다. */
  const auth = getAuth(app);
  window.__auth = auth;
  window.__uid = null;
  window.__authReady = new Promise(function(resolve){
    onAuthStateChanged(auth, function(u){
      if (u) { window.__uid = u.uid; resolve(u.uid); }
    });
    signInAnonymously(auth).catch(function(e){
      console.error('익명 로그인 실패', e);
      resolve(null);   // 실패해도 앱은 계속 뜬다
    });
  });


  function applySharedTheme(t){
    if(!t||!/^#[0-9a-fA-F]{6}$/.test((t&&t.green)||'')) return;
    const r=document.documentElement;
    const rgba=(hex,a)=>{const x=parseInt(hex.slice(1),16);return `rgba(${x>>16},${(x>>8)&255},${x&255},${a})`;};
    r.style.setProperty('--green',t.green);
    r.style.setProperty('--green-dark',/^#[0-9a-fA-F]{6}$/.test(t.dark||'')?t.dark:t.green);
    r.style.setProperty('--green-bg',rgba(t.green,0.08));
    r.style.setProperty('--green-line',rgba(t.green,0.14));
    r.style.setProperty('--green-border',rgba(t.green,0.26));
    r.style.setProperty('--green-faint',rgba(t.green,0.045));
  }

  let allStudents = [];
  let allData = {};
  let allAttendance = {};
  let allCalEvents = {};
  let calView = new Date();
  let allMemos = {};
  let allSubjects = [];
  let allJournals = [];
  let allNotices = [];
  let allJComments = {};
  let allAttTimes = {};   // attendanceLog
  let allMsgsP = [];
  let selectedStudent = null;

  function pEsc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* 공지 읽기 팝업 - 달력·공지카드 어디서 눌러도 전문이 보이게 */
  window.pNoticeView = function(nid) {
    const key = String(nid);
    const n = (allNotices || []).find(function(x){ return x.id === key; })
           || (allNotices || []).find(function(x){ return 'n_' + x.id === key; });
    if (!n) return;
    window.pNoticeClose();
    const back = document.createElement('div');
    back.id = 'pNoticeBack';
    back.style.cssText = 'position:fixed;inset:0;background:rgba(20,35,26,.45);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px';
    back.onclick = function(e){ if (e.target === back) window.pNoticeClose(); };
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:82vh;overflow-y:auto;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.22);border-top:5px solid '
      + (n.pinned ? '#b8900f' : 'var(--green)');
    let h = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px">'
      + '<div style="font-size:21px;font-weight:700;color:#1a2e22;line-height:1.4;word-break:break-word">'
      + (n.pinned ? '<span style="display:inline-block;background:rgba(184,144,15,.18);color:#8a6a0c;font-size:12px;font-weight:700;border-radius:10px;padding:2px 9px;margin-right:6px;vertical-align:2px">📌 상단고정</span>' : '')
      + pEsc(n.title) + '</div>'
      + '<button id="pNoticeX" style="background:none;border:none;color:#aaa;font-size:22px;cursor:pointer;line-height:1;padding:0 4px">✕</button></div>'
      + '<div style="font-size:12px;color:#8aa392;font-family:\'Space Mono\',monospace;margin-bottom:14px">' + pEsc(n.date) + '</div>'
      + '<div style="font-size:18px;line-height:1.75;color:#2a3b31;white-space:pre-wrap;word-break:break-word">' + linkify(pEsc(n.content)) + '</div>';
    if (n.attachments && n.attachments.length && typeof noticeAttachHtml === 'function') h += noticeAttachHtml(n);
    box.innerHTML = h;
    back.appendChild(box);
    document.body.appendChild(back);
    const x = document.getElementById('pNoticeX');
    if (x) x.onclick = window.pNoticeClose;
  };
  window.pNoticeClose = function() {
    const b = document.getElementById('pNoticeBack');
    if (b) b.remove();
  };


  let DDAYS = [
    { label: '2027 수능', date: '2026-11-19' },
    { label: '2028 수능', date: '2027-11-18' }
  ];
  function ddayChips(light) {
    const today = new Date(); today.setHours(0,0,0,0);
    return '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">' + DDAYS.map(function(d) {
      const diff = Math.round((new Date(d.date+'T00:00:00') - today) / 86400000);
      if (diff < 0) return '';
      const dtxt = diff === 0 ? 'D-DAY' : 'D-' + diff;
      return '<span style="background:' + (light?'rgba(255,255,255,.18)':'var(--green-bg)') + ';border:1px solid ' + (light?'rgba(255,255,255,.35)':'var(--green-border)') + ';border-radius:999px;font-size:12px;font-weight:700;padding:4px 12px;color:' + (light?'#fff':'var(--green-dark)') + '">'
        + d.label + ' <b style="color:' + (light?'#f5d67a':'#b8900f') + '">' + dtxt + '</b></span>';
    }).join('') + '</div>';
  }

  function savePCache() {
    try {
      const slim = allNotices.map(function(n){ const c = Object.assign({}, n); delete c.attachments; return c; });
      localStorage.setItem('jinius_pcache', JSON.stringify({
        st: allStudents, att: allAttendance, j: allJournals.slice(0, 60), ce: allCalEvents,
        n: slim, jc: allJComments, m: allMsgsP.slice(-80), dd: DDAYS, d: allData, me: allMemos, sb: allSubjects
      }));
    } catch(e){}
  }

  /* ── 홈화면 앱 자동 로그인 토큰 (iOS는 사파리/홈화면앱 저장소가 분리됨) ── */
  function makeToken() { return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  async function issueAutoToken(sid) {
    try {
      let tk = localStorage.getItem('jinius_parent_token');
      if (!tk) { tk = makeToken(); localStorage.setItem('jinius_parent_token', tk); }
      await set(ref(db, 'autoLogin/' + tk), { sid: sid, role: 'parent', at: new Date().toISOString() });
      const u = new URL(location.href);
      u.searchParams.set('k', tk);
      history.replaceState({}, '', u.toString());
    } catch(e) { console.error(e); }
  }
  async function parentTokenLogin() {
    const tk = new URLSearchParams(location.search).get('k');
    if (!tk) return null;
    try {
      const snap = await get(ref(db, 'autoLogin/' + tk));
      if (!snap.exists()) return null;
      const rec = snap.val() || {};
      if (rec.role !== 'parent' || !rec.sid) return null;
      localStorage.setItem('jinius_parent_login_at', String(Date.now())); localStorage.setItem('jinius_parent_login', JSON.stringify({ id: rec.sid }));
      claimUid('parent', rec.sid);
      localStorage.setItem('jinius_parent_token', tk);
      return rec.sid;
    } catch(e) { console.error(e); return null; }
  }

  /* 일지 열람 기록 - 카드가 실제로 화면에 들어오면 한 번만 남긴다 */
  let _jrDone = {};
  function markJournalRead(jid) {
    if (!jid || _jrDone[jid] || !selectedStudent) return;
    _jrDone[jid] = true;
    try {
      set(ref(db, 'journalReads/' + jid + '/' + selectedStudent.id), {
        at: new Date().toISOString(), by: 'parent'
      });
    } catch(e) { console.error(e); }
  }
  function watchJournalCards() {
    if (!('IntersectionObserver' in window)) {
      document.querySelectorAll('[data-jid]').forEach(function(el){ markJournalRead(el.dataset.jid); });
      return;
    }
    const io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting) { markJournalRead(e.target.dataset.jid); io.unobserve(e.target); }
      });
    }, { threshold: 0.5 });
    document.querySelectorAll('[data-jid]').forEach(function(el){ io.observe(el); });
  }

  function applyPCache() {
    try {
      const c = __nfcDeep(JSON.parse(localStorage.getItem('jinius_pcache') || 'null'));
      if (!c || !c.st || !c.st.length) return false;
      allStudents = c.st; allAttendance = c.att || {}; allJournals = c.j || [];
      allCalEvents = c.ce || {}; allNotices = c.n || []; allJComments = c.jc || {};
      allMsgsP = c.m || []; if (Array.isArray(c.dd)) DDAYS = c.dd;
      allData = c.d || {}; allMemos = c.me || {}; allSubjects = c.sb || [];
      return true;
    } catch(e){ return false; }
  }
  async function loadAll() {
    // ★ 캐시가 있으면 즉시 화면부터 (로딩 문구 없이) — 최신 데이터는 뒤에서 갱신
    let fastEntered = false;
    if (applyPCache()) {
      document.getElementById('loadingMsg').style.display = 'none';
      const savedFast = (loginStillValid() ? localStorage.getItem('jinius_parent_login') : null);
      if (savedFast) {
        try {
          const stF = allStudents.find(x => x.id === JSON.parse(savedFast).id);
          if (stF) { enterDashboard(stF); fastEntered = true; }
        } catch(e){}
      }
      if (!fastEntered) document.getElementById('loginSection').style.display = 'block';
    }
  var allRoadmaps = { list: [], assign: {}, progress: {} };
  function rmParentCard(sid) {
    try {
      var ids = (allRoadmaps.assign && allRoadmaps.assign[sid]) || [];
      var mine = ids.map(function(id){ return (allRoadmaps.list||[]).find(function(r){ return r && r.id === id; }); }).filter(Boolean);
      if (!mine.length) return '';
      var h = '<div class="dash-card" style="margin-top:14px"><div class="dash-card-title">🧭 학습 진도</div>';
      mine.forEach(function(r){
        var items = r.items || [];
        var prog = (allRoadmaps.progress && allRoadmaps.progress[r.id] && allRoadmaps.progress[r.id][sid]) || {};
        var done = Object.keys(prog).length, total = items.length;
        var pct = total ? Math.round(done/total*100) : 0;
        var last = '', lastDate = '';
        items.forEach(function(it){ if (prog[it.id] && prog[it.id] >= lastDate) { lastDate = prog[it.id]; last = it.label; } });
        h += '<div style="margin-bottom:14px">'
          + '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">'
          + '<span style="font-size:14.5px;font-weight:700;color:#1a2e22">📘 ' + r.title + '</span>'
          + '<span style="font-size:12.5px;color:#2f6947;font-weight:700">' + done + '/' + total + '단원 (' + pct + '%)</span></div>'
          + '<div style="height:10px;background:#eef3ef;border-radius:999px;overflow:hidden">'
          + '<div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#2f6947,#5c8a68);border-radius:999px"></div></div>'
          + (last ? '<div style="font-size:12px;color:#6b8a74;margin-top:5px">최근: ' + last + ' 완료 (' + String(lastDate).slice(5) + ')</div>' : '')
          + '</div>';
      });
      return h + '</div>';
    } catch(e) { console.error('로드맵 카드', e); return ''; }
  }

    try {
      // 모든 데이터를 동시에 요청 (로딩 시간 단축)
      const [th, snap, jSnap, cSnap, lkSnap, mSnap, jcSnap, nSnap, algSnap, attSnap, ddSnap, rmSnap] = await Promise.all([
        get(ref(db,'settings/theme')).catch(()=>null),
        get(ref(db, 'authIndex')).catch(()=>null),
        get(ref(db, 'journals')).catch(()=>null),
        get(ref(db, 'calEvents')).catch(()=>null),
        get(ref(db, 'customLinks')).catch(()=>null),
        get(ref(db, 'messages')).catch(()=>null),
        get(ref(db, 'journalComments')).catch(()=>null),
        get(ref(db, 'notices')).catch(()=>null),
        get(ref(db, 'attendanceLog')).catch(()=>null),
        get(ref(db, 'jinius/attendance')).catch(()=>null),
        get(ref(db, 'settings/ddays')).catch(()=>null),
        get(ref(db, 'roadmaps')).catch(()=>null)
      ]);
      try { if (th && th.exists()) applySharedTheme(th.val()); } catch(e){}
      // ★ jinius 에는 전교생 비밀번호가 들어 있어 학부모는 못 읽는다.
      //   로그인 목록에서 이름·학년만 가져온다.
      if (snap && snap.exists()) {
        const idx = snap.val() || {};
        allStudents = Object.keys(idx).filter(function(k){ return k.indexOf('s_') === 0; })
          .map(function(k){ const e = idx[k];
            return { id: e.id, name: e.name, grade: e.grade || '', subject: e.subject || '' }; });
      }
      if (jSnap && jSnap.exists() && Array.isArray(jSnap.val())) allJournals = jSnap.val();
      try { if (cSnap && cSnap.exists()) allCalEvents = cSnap.val()||{}; } catch(e){}
      try {
        const lks = (lkSnap && lkSnap.exists() && Array.isArray(lkSnap.val())) ? lkSnap.val() : [];
        document.getElementById('pLinksList').innerHTML = lks.length ? lks.map(l =>
          '<a href="'+l.url+'" target="_blank" style="background:#fff;border:1px solid var(--green-border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-decoration:none;box-shadow:0 1px 4px rgba(47,105,71,.06)">'
          + '<span style="font-size:26px">'+(l.icon||'🔗')+'</span>'
          + '<span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:700;color:#1a2e22">'+l.title+'</span>'
          + (l.desc?'<span style="display:block;font-size:12px;color:#6b8a74">'+l.desc+'</span>':'')+'</span>'
          + '<span style="background:var(--green);border-radius:8px;color:#fff;font-size:13px;font-weight:600;padding:8px 16px;white-space:nowrap">열기 →</span>'
          + '</a>').join('') : '<div style="text-align:center;color:#aaa;font-size:13px;padding:10px">등록된 링크가 없습니다</div>';
      } catch(e){}
      try { if (mSnap && mSnap.exists() && Array.isArray(mSnap.val())) allMsgsP = mSnap.val(); } catch(e){}
      try { if (jcSnap && jcSnap.exists()) allJComments = jcSnap.val()||{}; } catch(e){}
      try { if (algSnap && algSnap.exists()) allAttTimes = algSnap.val()||{}; } catch(e){}
      try { if (attSnap && attSnap.exists()) allAttendance = attSnap.val()||{}; } catch(e){}
      try { const xS = await get(ref(db, 'exams')); if (xS.exists()) { allExams = xS.val()||[]; if (!Array.isArray(allExams)) allExams = Object.values(allExams); } } catch(e){}
      if (nSnap && nSnap.exists() && Array.isArray(nSnap.val())) allNotices = nSnap.val();
      try { if (ddSnap && ddSnap.exists() && Array.isArray(ddSnap.val())) DDAYS = ddSnap.val(); } catch(e){}
      try { if (rmSnap && rmSnap.exists()) { const rv = rmSnap.val()||{}; allRoadmaps = { list: Array.isArray(rv.list)?rv.list:Object.values(rv.list||{}), assign: rv.assign||{}, progress: rv.progress||{} }; } } catch(e){}
      document.getElementById('loadingMsg').style.display = 'none';
      savePCache();
      // 캐시로 이미 입장한 상태면: 최신 데이터로 조용히 다시 그림
      if (fastEntered && selectedStudent) {
        const fresh = allStudents.find(x => x.id === selectedStudent.id);
        if (fresh) { const sy = window.scrollY; enterDashboard(fresh); window.scrollTo(0, sy); }
        return;
      }
      // 자동 로그인 (기기에 세션 저장돼 있으면)
      if (!(loginStillValid() ? localStorage.getItem('jinius_parent_login') : null)) { await parentTokenLogin(); }
      const saved = (loginStillValid() ? localStorage.getItem('jinius_parent_login') : null);
      if (saved) {
        try {
          const st = allStudents.find(x => x.id === JSON.parse(saved).id);
          if (st) { claimUid('parent', st.id); enterDashboard(st); return; }
          try { const tk = localStorage.getItem('jinius_parent_token'); if (tk) set(ref(db,'autoLogin/'+tk), null); } catch(e){}
    localStorage.removeItem('jinius_parent_token');
    localStorage.removeItem('jinius_parent_login'); localStorage.removeItem('jinius_parent_login_at'); // 학생을 못 찾으면 세션 폐기
        } catch(e){ localStorage.removeItem('jinius_parent_login'); localStorage.removeItem('jinius_parent_login_at'); }
      }
      document.getElementById('loginSection').style.display = 'block';
    } catch(e) {
      document.getElementById('loadingMsg').textContent = '데이터 로드 실패: ' + e.message;
    }
  }

  function renderStudentBtns() {
    const el = document.getElementById('studentBtns');
    el.innerHTML = allStudents.map(s =>
      `<button class="stu-btn" onclick="window.selectStudent('${s.id}')">${s.name} <span class="grade-tag">${s.grade||''}</span></button>`
    ).join('');
  }


  function noticeAttachHtml(n) {
    if (!n.attachments || !n.attachments.length) return '';
    return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">' + n.attachments.map(function(a) {
      return a.type === 'image'
        ? '<a href="' + a.data + '" target="_blank"><img src="' + a.data + '" style="width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--green-border)"></a>'
        : '<a href="' + a.data + '" download="' + a.name + '" style="display:inline-flex;align-items:center;gap:5px;background:var(--green-bg);border:1px solid var(--green-border);border-radius:8px;font-size:12px;padding:7px 11px;text-decoration:none;color:var(--green-dark);font-weight:600">📄 ' + a.name + ' ⬇</a>';
    }).join('') + '</div>';
  }

  function countNewsParent() {
    if (!selectedStudent) return { msg:0, notice:0, total:0 };
    const pid = 'parent_' + selectedStudent.id;
    const unreadMsg = (allMsgsP||[]).filter(function(m){ return m.fromStaff && m.toId === pid && !m.read; }).length;

  /* ── 한글 자모 분리(NFD) 방지: 저장·표시 모두 NFC로 통일 ── */
  function nfc(v) {
    if (typeof v === 'string') { try { return v.normalize('NFC'); } catch(e) { return v; } }
    if (Array.isArray(v)) { for (var i=0;i<v.length;i++) v[i] = nfc(v[i]); return v; }

    return v;

  if (t.tagName === 'INPUT' && /^(file|checkbox|radio|range|color|date|datetime-local|month|week|time|number|hidden|submit|button|image|reset)$/i.test(t.type)) return;
  var v = t.value; if (typeof v !== 'string' || !v) return;
  var n; try { n = v.normalize('NFC'); } catch(e) { return; }
  if (n !== v) { var p = t.selectionStart; t.value = n; try { t.setSelectionRange(p, p); } catch(e2) {} }
}
document.addEventListener('compositionend', function(e){ __nfcFix(e.target); }, true);
document.addEventListener('paste', function(e){ var t=e.target; setTimeout(function(){ __nfcFix(t); }, 0); }, true);
document.addEventListener('blur', function(e){ __nfcFix(e.target); }, true);

    if (e.isComposing || t.composing) return;

    function linkify(t) {
  // 이미 이스케이프된 텍스트에서 주소만 찾아 링크로 바꾼다.
  // (esc 를 먼저 거치므로 여기서 태그가 새로 생길 위험은 없다)
  return String(t == null ? '' : t).replace(

  function calHasParent(e) {

  /* 서버 최신본과 합쳐 저장 - 통째로 덮어쓰면 그 사이 온 메시지가 사라진다 */
  async function saveMessagesMerged(local) {
    try {
      const snap = await get(ref(db, 'messages'));
      let server = asArr(snap.exists() ? snap.val() : []);
      const byId = {};
      server.forEach(function(m){ if (m && m.id) byId[m.id] = m; });
      (local || []).forEach(function(m){
        if (!m || !m.id) return;
        const prev = byId[m.id];
        byId[m.id] = prev ? Object.assign({}, prev, m, { read: !!(prev.read || m.read), readAt: m.readAt || prev.readAt }) : m;
      });
      const merged = Object.keys(byId).map(function(k){ return byId[k]; })
        .sort(function(a,b){ return String(a.createdAt||'').localeCompare(String(b.createdAt||'')); });
      // undefined 가 하나라도 있으면 Firebase 가 통째로 거부한다 → 미리 걷어낸다
      const clean = merged.map(function(m){
        const o = {};
        Object.keys(m || {}).forEach(function(k){ if (m[k] !== undefined) o[k] = m[k]; });
        return o;
      });
      await set(ref(db, 'messages'), clean);
      return clean;
    } catch(e) {
      console.error('메시지 저장 실패', e);
      throw e;              // ← 조용히 삼키면 '전송 완료'가 거짓말이 된다
    }
  }

  /* Firebase 는 중간 인덱스가 비면 배열을 객체로 돌려준다.
     Array.isArray 만 보면 그 순간부터 메시지가 통째로 안 보인다. */
  function asArr(v) {
    if (!v) return [];
    return Array.isArray(v) ? v.filter(Boolean) : Object.values(v).filter(Boolean);
  }

  /* 30일 자동 로그인: 저장 시각을 함께 남기고, 지나면 다시 로그인 */

  function dateKey(d) { const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }

  /* ── 시험 리포트 (읽기 전용) ── */
  let allExams = [];
  const GRADE_PCT_S = {1:96,2:89,3:77,4:60,5:40,6:23,7:11,8:4,9:1};
  function exTakers(ex){ const sc=ex.scores||{}; return Object.keys(sc).filter(function(k){ return sc[k] && sc[k].total!=null && sc[k].total!==''; }); }
  function exPct(ex,sid){ const sc=(ex.scores||{})[sid]; if(!sc||sc.total==null||sc.total==='')return null; const m=Number(ex.max)||100; return Math.round(Number(sc.total)/m*1000)/10; }
  function exAvg(ex){ const t=exTakers(ex); if(!t.length)return null; return t.reduce(function(s,k){return s+Number(ex.scores[k].total);},0)/t.length; }
  function exRank(ex,sid){ const t=exTakers(ex); if(t.indexOf(sid)===-1)return null; const m=Number(ex.scores[sid].total);
    return {rank:t.filter(function(x){return Number(ex.scores[x].total)>m;}).length+1, of:t.length}; }
  function exGrade(ex,sid){ if(!ex.cuts)return null; const sc=(ex.scores||{})[sid]; if(!sc||sc.total==null)return null;
    const v=Number(sc.total); for(let g=1;g<=9;g++){ if(ex.cuts[g]==null||ex.cuts[g]==='')continue; if(v>=Number(ex.cuts[g]))return g; } return 9; }
  function exSeries(sid){ return (allExams||[]).filter(function(ex){ const s=(ex.scores||{})[sid]; return s && s.total!=null && s.total!==''; })
    .sort(function(a,b){ return String(a.date||'').localeCompare(String(b.date||'')); }); }
  function exAreaStats(sid, ser){ const acc={};
    ser.forEach(function(ex){ const sc=(ex.scores||{})[sid]; if(!sc||!sc.areas||!ex.areas)return;
      ex.areas.forEach(function(a){ const v=sc.areas[a.name]; if(v==null||!a.max)return;
        if(!acc[a.name])acc[a.name]={got:0,max:0}; acc[a.name].got+=Number(v); acc[a.name].max+=Number(a.max); }); });
    return Object.keys(acc).map(function(k){ return {name:k,pct:Math.round(acc[k].got/acc[k].max*1000)/10}; }).sort(function(a,b){ return b.pct-a.pct; }); }
  function exTrendSvg(ser,sid){
    const W=560,H=170,PL=32,PR=10,PT=14,PB=24;
    if(ser.length<2) return '<div style="font-size:12px;color:#8aa392;padding:8px 0">회차가 2개 이상이면 그래프가 나와요.</div>';
    const pts=ser.map(function(e){return exPct(e,sid);});
    const iw=W-PL-PR, ih=H-PT-PB;
    const X=function(i){return PL+iw*i/(ser.length-1);}, Y=function(v){return PT+ih*(1-v/100);};
    let g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
    [0,25,50,75,100].forEach(function(v){ g+='<line x1="'+PL+'" y1="'+Y(v)+'" x2="'+(W-PR)+'" y2="'+Y(v)+'" stroke="#e4efe8"/><text x="'+(PL-5)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="10" fill="#a5bcac">'+v+'</text>'; });
    let d=''; pts.forEach(function(v,i){ d+=(i?' L':'M')+X(i)+' '+Y(v); });
    g+='<path d="'+d+'" fill="none" stroke="#3d8a5e" stroke-width="2.5" stroke-linejoin="round"/>';
    pts.forEach(function(v,i){ g+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="4" fill="#fff" stroke="#3d8a5e" stroke-width="2.5"/>'
      +'<text x="'+X(i)+'" y="'+(Y(v)-9)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#2a5f42">'+v+'</text>'
      +'<text x="'+X(i)+'" y="'+(H-7)+'" text-anchor="middle" font-size="9" fill="#8aa392">'+(i+1)+'회</text>'; });
    return g+'</svg>';
  }
  function exBar(label,pct,tag){
    const p=Math.max(0,Math.min(100,pct));
    const col=p>=80?'#3d8a5e':p>=60?'#d3a625':'#e07a5f';
    return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">'
      +'<span style="width:80px;font-size:12px;color:#4a6653;flex-shrink:0">'+pEsc(label)+'</span>'
      +'<div style="flex:1;height:12px;background:var(--green-faint);border-radius:999px;overflow:hidden"><div style="width:'+p+'%;height:100%;background:'+col+';border-radius:999px"></div></div>'
      +'<span style="width:70px;text-align:right;font-family:Space Mono,monospace;font-size:11px;color:#6b8a74;flex-shrink:0">'+(Math.round(p*10)/10)+'%'+(tag||'')+'</span></div>';
  }
  /* ── 자녀 시험 성적 (선생님이 학생별로 입력한 것) ──
     Firebase: studentTests/{내id} = [ {date,title,score,max,note} ]
     시험명(분류)별로 묶어서 추이를 보여준다. */
  let myTests = [];
  let testStats = {};   // "시험명|날짜" -> { n, avg, best }  (원장이 계산해 올려둔 값)
  function statOf(t) {
    const k = (String(t.title||'').trim() + '|' + String(t.date||'')).replace(/[.#$\[\]\/]/g, '_');
    return testStats[k] || null;
  }
  function mtPct(t) {
    const m = Number(t.max) || 0;
    return m ? Math.round(Number(t.score) / m * 1000) / 10 : 0;
  }
  function mtGroups() {
    const g = {};
    (myTests || []).forEach(function(t){
      const k = String(t.title || '기타').trim();
      (g[k] = g[k] || []).push(t);
    });
    Object.keys(g).forEach(function(k){
      g[k].sort(function(a,b){ return String(a.date||'').localeCompare(String(b.date||'')); });
    });
    return g;
  }
  function mtSpark(list) {
    const W = 560, H = 116, PL = 10, PR = 10, PT = 20, PB = 16;
    if (!list.length) return '';
    const pts = list.map(mtPct);
    const iw = W - PL - PR, ih = H - PT - PB;
    const X = function(i){ return list.length === 1 ? W/2 : PL + iw * i / (list.length - 1); };
    const Y = function(v){ return PT + ih * (1 - v/100); };
    let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;background:rgba(61,138,94,.05);border-radius:8px">';
    if (list.length > 1) {
      let d = '', a = 'M' + X(0) + ' ' + (H-PB);
      pts.forEach(function(v,i){ d += (i?' L':'M') + X(i) + ' ' + Y(v); a += ' L' + X(i) + ' ' + Y(v); });
      a += ' L' + X(list.length-1) + ' ' + (H-PB) + ' Z';
      g += '<path d="' + a + '" fill="rgba(61,138,94,.12)"/>'
        + '<path d="' + d + '" fill="none" stroke="#3d8a5e" stroke-width="2.2" stroke-linejoin="round"/>';
    }
    pts.forEach(function(v,i){
      g += '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="3.4" fill="#fff" stroke="#3d8a5e" stroke-width="2.2"/>'
        + '<text x="' + X(i) + '" y="' + (Y(v)-7) + '" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2a5f42">' + v + '</text>';
    });
    return g + '</svg>';
  }
  function myTestsHtml() {
    const groups = mtGroups();
    const keys = Object.keys(groups).sort();
    if (!keys.length) return '';
    let h = '<div class="section-label">📊 자녀 시험 성적</div>';
    keys.forEach(function(k){
      const list = groups[k];
      const p = list.map(mtPct);
      const last = p[p.length-1], best = Math.max.apply(null, p);
      const avg = Math.round(p.reduce(function(a,b){return a+b;},0) / p.length);
      const trend = p.length >= 2 ? Math.round(last - p[0]) : 0;
      const chip = function(l, v, bg, c) {
        return '<span style="background:' + bg + ';color:' + c + ';border-radius:999px;font-size:11.5px;font-weight:700;padding:3px 9px;white-space:nowrap">' + l + ' ' + v + '</span>';
      };
      h += '<div style="background:#fff;border:1px solid var(--green-border);border-radius:12px;padding:13px;margin-bottom:11px">'
        + '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:9px">'
        +   '<span style="font-size:15px;font-weight:800;color:#1a2e22">' + pEsc(k) + '</span>'
        +   chip('최근', last + '%', 'rgba(74,144,217,.13)', '#2c6db0')
        +   chip('최고', best + '%', 'rgba(184,144,15,.15)', '#8a6a0c')
        +   chip('평균', avg + '%', 'var(--green-faint)', '#4a6653')
        +   (p.length >= 2 ? chip(trend >= 0 ? '▲' : '▼', Math.abs(trend) + 'p',
              trend >= 0 ? 'rgba(61,138,94,.13)' : 'rgba(224,122,95,.15)',
              trend >= 0 ? 'var(--green-dark)' : '#c0563a') : '')
        + '</div>'
        + mtSpark(list)
        + '<div style="margin-top:7px">'
        + list.slice().reverse().map(function(t){
            const pc = mtPct(t);
            const st2 = statOf(t);
            const gap = st2 ? Math.round((pc - st2.avg)*10)/10 : null;
            return '<div style="padding:6px 2px;border-bottom:1px solid var(--green-line)">'
              + '<div style="display:flex;align-items:center;gap:9px;font-size:12.5px">'
              + '<span style="font-family:Space Mono,monospace;color:#8aa392;flex-shrink:0">' + pEsc(String(t.date||'').slice(2)) + '</span>'
              + '<span style="flex:1;min-width:0;color:#2a3b31;word-break:break-word">' + pEsc(t.note || t.title || '') + '</span>'
              + '<span style="color:#6b8a74;font-family:Space Mono,monospace;flex-shrink:0">' + t.score + '/' + t.max + '</span>'
              + '<span style="font-weight:800;width:44px;text-align:right;flex-shrink:0;color:'
                + (pc>=80?'var(--green)':pc>=60?'#b7791f':'#e07a5f') + '">' + pc + '%</span></div>'
              + (st2 ? '<div style="font-size:11px;color:#8aa392;margin-top:1px">👥 ' + st2.n + '명 · 반 평균 ' + st2.avg + '% · <span style="color:'
                  + (gap>=0?'var(--green)':'#e07a5f') + ';font-weight:700">' + (gap>=0?'+':'') + gap + '%p</span></div>' : '')
              + '</div>';
          }).join('')
        + '</div></div>';
    });
    return h;
  }

      ar.forEach(function(a,i){ h+=exBar(a.name,a.pct,i===0?' 👍':(i===ar.length-1?' ⚠️':'')); }); }
    h+='<div style="font-size:12px;font-weight:700;color:var(--green-dark);margin:14px 0 6px">👥 회차별 기록</div>';
    h+='<div style="overflow-x:auto"><table style="width:100%;min-width:340px;border-collapse:collapse;font-size:12px">'
      +'<tr style="color:#8aa392"><th style="text-align:left;padding:4px 2px">회차</th><th>내 점수</th><th>반 평균</th><th>차이</th><th>등수</th></tr>'
      +ser.map(function(ex,i){ const mine=Number(ex.scores[sid].total), ca=exAvg(ex), rk=exRank(ex,sid);
        const gap=ca!=null?Math.round((mine-ca)*10)/10:null;
        return '<tr style="border-top:1px solid var(--green-line)"><td style="text-align:left;padding:5px 2px">'+(i+1)+'. '+pEsc(ex.title)+'</td>'
          +'<td style="text-align:center;font-weight:700">'+mine+'</td><td style="text-align:center">'+(ca!=null?Math.round(ca*10)/10:'—')+'</td>'

          +'<td style="text-align:center">'+(rk?rk.rank+'/'+rk.of:'—')+'</td></tr>'; }).join('')
      +'</table></div>';

    return h;
  }

  /* ══════════ 새 버전 자동 반영 ══════════
     아이폰 홈 화면 앱은 예전 HTML 을 캐시에 오래 물고 있다.
     원장님이 새 파일을 올려도 애들 앱은 옛 화면 그대로였고,
     로그아웃(= 주소 재이동)을 해야만 갱신됐다.
     서버에 적힌 버전과 지금 실행 중인 버전이 다르면 스스로 다시 받는다. */
  const APP_VER = 'p8.04-06';

  /* 업데이트 안내 띠 — 화면 아래에 잠깐 떴다 사라진다 */
  function showUpdateBar(text, sub, stay) {
    const old = document.getElementById('updBar');
    if (old) old.remove();
    const b = document.createElement('div');
    b.id = 'updBar';
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:14px;z-index:99999;'
      + 'background:var(--green-dark,#2f6947);color:#fff;border-radius:14px;padding:13px 16px;'
      + 'box-shadow:0 8px 26px rgba(20,45,30,.28);font-family:inherit;display:flex;align-items:center;gap:11px;'
      + 'opacity:0;transform:translateY(14px);transition:opacity .28s,transform .28s';
    b.innerHTML = '<span style="font-size:20px;flex-shrink:0">✨</span>'
      + '<div style="flex:1;min-width:0">'
      +   '<div style="font-size:14px;font-weight:800">' + text + '</div>'
      +   (sub ? '<div style="font-size:12px;opacity:.85;margin-top:2px;word-break:break-word">' + sub + '</div>' : '')
      + '</div>'
      + '<span onclick="this.parentNode.remove()" style="font-size:18px;opacity:.7;cursor:pointer;flex-shrink:0;padding:0 2px">✕</span>';
    document.body.appendChild(b);
    requestAnimationFrame(function(){ b.style.opacity = '1'; b.style.transform = 'translateY(0)'; });
    if (stay !== 0) setTimeout(function(){
      if (!b.parentNode) return;
      b.style.opacity = '0'; b.style.transform = 'translateY(14px)';
      setTimeout(function(){ b.remove(); }, 300);
    }, stay || 7000);
  }

  async function checkAppVersion() {
    try {
      const [vs, ns] = await Promise.all([
        get(ref(db, 'settings/parentVer')).catch(function(){ return null; }),
        get(ref(db, 'settings/parentVerNote')).catch(function(){ return null; })
      ]);
      const want = (vs && vs.exists()) ? String(vs.val() || '') : '';
      const note = (ns && ns.exists()) ? String(ns.val() || '') : '';

      // 방금 새 버전으로 갈아탄 참이면 알려준다
      const done = sessionStorage.getItem('jinius_ver_done');
      if (done && done === APP_VER) {
        sessionStorage.removeItem('jinius_ver_done');
        setTimeout(function(){
          showUpdateBar('업데이트 완료 · ' + APP_VER, note || '새 기능이 반영됐어요');
        }, 900);
      }

      if (!want || want === APP_VER) return;

      const tried = sessionStorage.getItem('jinius_ver_try');
      if (tried === want) {
        console.warn('새 버전(' + want + ')을 받지 못했습니다. 서버에 파일이 아직 안 올라갔을 수 있어요.');
        return;
      }
      sessionStorage.setItem('jinius_ver_try', want);
      sessionStorage.setItem('jinius_ver_done', want);
      showUpdateBar('업데이트가 있습니다 · ' + want, '새로 받는 중이에요...', 0);
      setTimeout(function(){
        location.replace(location.pathname + '?v=' + encodeURIComponent(want));
      }, 1100);
    } catch(e) { /* 네트워크 문제면 그냥 지금 버전으로 쓴다 */ }
  }


  /* ── 자녀 과제 (달력 표시용) ── */
  let allPTasks = [];
  function pTaskDueTs(t) {
    if (!t.dueDate) return null;
    return new Date(t.dueDate + 'T' + (t.dueTime || '23:59') + ':00').getTime();
  }
  function taskAttachHtml(t) {
    const arr = (t && Array.isArray(t.files)) ? t.files : [];
    if (!arr.length) return '';
    return '<div style="font-size:11px;color:#6b8a74;margin:6px 0 4px">📎 선생님이 준 자료 ' + arr.length + '개</div>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px">' + arr.map(function(a){
      const th = a.type === 'image'
        ? '<img src="' + a.data + '" style="width:74px;height:74px;object-fit:cover;display:block">'
        : '<div style="width:74px;height:74px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#6b8a74;text-align:center;padding:4px;box-sizing:border-box;word-break:break-all">📄 ' + pEsc((a.name||'파일').slice(0,12)) + '</div>';
      return '<a href="' + a.data + '" download="' + pEsc(a.name||'첨부') + '" target="_blank" rel="noopener" style="border:1px solid var(--green-border);border-radius:8px;overflow:hidden;display:block">' + th + '</a>';
    }).join('') + '</div>';
  }

  function pTaskSubs(t) {
    if (Array.isArray(t.submissions)) return t.submissions;
    if (t.submission) return [t.submission];
    return [];
  }
  function pTaskStatus(t) {
    const need = (t.needFile !== false);
    const subs = pTaskSubs(t);
    const due = pTaskDueTs(t);
    // 늦음 판정은 '처음 낸 시각' 기준. 원장 확인 시각은 늦음과 무관하다.
    const firstAt = subs.length ? Math.min.apply(null, subs.map(function(x){ return new Date(x.at).getTime(); })) : null;
    const doneAt = firstAt || (t.doneAt ? new Date(t.doneAt).getTime() : null);
    const late = !!(due && doneAt && doneAt > due);

    if (t.rejected) return { key:'rejected', label:'↩️ 다시 제출', bg:'rgba(224,122,95,.18)', fg:'#c0563a' };

    if (need) {
      if (!subs.length) {
        if (due && Date.now() > due) return { key:'overdue', label:'🔴 미제출', bg:'#fdeaea', fg:'#c0392b' };
        return { key:'todo', label:'📝 과제', bg:'rgba(124,58,237,.14)', fg:'#6d28d9' };
      }
      if (!t.approved) return { key:'review', label:'📤 제출함 · 확인중', bg:'rgba(74,144,217,.16)', fg:'#2c6db0' };
      if (late) return { key:'late', label:'⏰ 늦게 제출', bg:'rgba(184,144,15,.2)', fg:'#8a6a0c' };
      return { key:'done', label:'✅ 확인 완료', bg:'rgba(61,138,94,.18)', fg:'#2a5f42' };
    }
    // 첨부가 필요 없는 과제는 학생 체크만으로 끝
    if (subs.length || t.done) {
      if (late) return { key:'late', label:'⏰ 늦게 함', bg:'rgba(184,144,15,.2)', fg:'#8a6a0c' };
      return { key:'done', label:'✅ 완료', bg:'rgba(61,138,94,.18)', fg:'#2a5f42' };
    }
    if (due && Date.now() > due) return { key:'overdue', label:'🔴 미제출', bg:'#fdeaea', fg:'#c0392b' };
    return { key:'todo', label:'📝 과제', bg:'rgba(124,58,237,.14)', fg:'#6d28d9' };
  }
  async function loadPTasks(sid) {
    try {
      const sn = await get(ref(db, 'studentTasks/' + sid));
      allPTasks = sn.exists() ? Object.entries(sn.val()).map(function(e){ return Object.assign({ key: e[0] }, e[1]); }) : [];
    } catch(e) { allPTasks = []; }

    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:82vh;overflow-y:auto;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.22);border-top:5px solid var(--green)';

      + '<div style="font-size:19px;font-weight:700;color:#1a2e22;line-height:1.4;word-break:break-word">📝 ' + pEsc(t.title||'') + '</div>'
      + '<button id="pNoticeX" style="background:none;border:none;color:#aaa;font-size:22px;cursor:pointer;line-height:1;padding:0 4px">✕</button></div>'
      + '<div style="margin-bottom:12px"><span style="background:' + st.bg + ';color:' + st.fg + ';font-size:12px;font-weight:700;border-radius:999px;padding:3px 11px">' + st.label + '</span>'
      + (t.dueDate ? ' <span style="font-size:12px;color:#8aa392;font-family:\'Space Mono\',monospace">마감 ' + pEsc(t.dueDate) + ' ' + pEsc(t.dueTime||'23:59') + '</span>' : '')
      + (st.key === 'review' ? '<div style="font-size:12px;color:#2c6db0;margin-top:5px">아이가 제출했고, 선생님이 확인하는 중입니다.</div>' : '')
      + (st.key === 'done' && t.approvedBy ? '<div style="font-size:12px;color:#4a6653;margin-top:5px">' + pEsc(t.approvedBy) + ' 선생님이 확인했습니다.</div>' : '')
      + (st.key === 'rejected' ? '<div style="font-size:12px;color:#c0563a;margin-top:5px">선생님이 다시 제출해달라고 요청했습니다.</div>' : '')
      + '</div>';
    if (t.desc) h += '<div style="font-size:16px;line-height:1.7;color:#2a3b31;white-space:pre-wrap;word-break:break-word;margin-bottom:12px">' + pEsc(t.desc) + '</div>';
    h += taskAttachHtml(t);
    // 제출물 자체는 학부모께 보여주지 않는다. 제출 여부만 알리면 충분하다.
    const psubs = pTaskSubs(t);
    if (psubs.length) {
      h += '<div style="background:var(--green-faint);border-radius:9px;padding:9px 12px;font-size:13px;color:#4a6653">'
        + '📎 제출물 ' + psubs.length + '개를 냈습니다 <span style="color:#8aa392;font-size:11px">· 내용은 선생님이 확인합니다</span></div>';
    }
    box.innerHTML = h;
    back.appendChild(box);
    document.body.appendChild(back);
    const x = document.getElementById('pNoticeX');
    if (x) x.onclick = window.pNoticeClose;
  };

  async function pwHash(pw) {
    try {
      const buf = new TextEncoder().encode('jinius|' + String(pw || ''));
      const d = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(d)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    } catch(e) { return 'plain:' + String(pw || ''); }
  }

  async function claimUid(role, who) {
    try {
      const uid = await (window.__authReady || Promise.resolve(null));
      if (!uid) return;
      await set(ref(db, 'uidMap/' + uid), { role: role, id: who || '', at: new Date().toISOString() });
    } catch(e) { console.error('uid 등록 실패', e); }
  }

  /* 학부모 일지 — 기본은 접힘. 제목 줄을 누르면 펼쳐진다.
     전에는 모든 일지가 통째로 펼쳐져 화면이 끝없이 길었다. */
  window.pToggleJournal = function(head) {
    const card = head.closest('.journal-card');
    if (!card) return;
    const body = card.querySelector('.jfold-body');
    const peek = card.querySelector('.jfold-peek');
    const arrow = card.querySelector('.jfold-arrow');
    const open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'block';
    if (peek) peek.style.display = open ? 'block' : 'none';
    if (arrow) arrow.style.transform = open ? 'rotate(0deg)' : 'rotate(90deg)';
  };

  function renderDashboard() {
    const s = selectedStudent;
    const sid = s.id;

    // 출결 계산
    let attO=0, attX=0, attL=0;
    Object.keys(allAttendance).forEach(dk => {
      const v = allAttendance[dk][sid];
      if(v==='O') attO++; else if(v==='X') attX++; else if(v==='L') attL++;
    });
    const attTotal = attO+attX+attL;
    const attRate = attTotal ? Math.round(attO/attTotal*100) : null;
    const attColor = attRate>=80?'var(--green)':attRate>=60?'#b7791f':'#e53e3e';

    // 최근 점수
    const scoreSubjects = allSubjects.filter(sub=>sub.type==='score');
    let scoreRows = '';
    const allDks = Object.keys(allData).sort().reverse();
    scoreSubjects.forEach(sub => {
      const recent = allDks.find(dk => allData[dk][sid] && allData[dk][sid][sub.id] !== undefined && allData[dk][sid][sub.id] !== '');
      if (recent) {
        const v = allData[recent][sid][sub.id];
        scoreRows += `<div class="info-row"><span class="info-label">${sub.name}</span><span class="info-val" style="color:var(--green);font-weight:700">${v}점 <span style="color:#aaa;font-size:11px">/ ${sub.max||100}</span></span></div>`;
      }
    });

    // 수업일지 (최근 5개)
    // 발행된 일지만 본다
    const myJournals = allJournals.filter(j=>j.studentId===sid && j.published !== false).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,10);
    let journalHtml = '';
    if (myJournals.length > 0) {
      journalHtml = myJournals.map(j => {
        const attLabel = j.att==='O'?'출석':j.att==='L'?'지각':'결석';
        const attColor2 = j.att==='O'?'var(--green)':j.att==='L'?'#b7791f':'#e53e3e';
        const nCmt = (allJComments[j.id]||[]).length;
        const body0 = (j.brief && j.brief.trim()) ? j.brief : (j.content || '');
        const peek = String(body0).replace(/\s+/g,' ').trim().slice(0, 42);
        return `<div class="journal-card jfold" data-jdate="${j.date}" data-jid="${j.id}">
          <div class="journal-card-header jfold-head" onclick="window.pToggleJournal(this)" style="cursor:pointer">
            <span class="jfold-arrow" style="color:#8aa392;font-size:12px;margin-right:4px;display:inline-block;transition:transform .15s">▸</span>
            <span class="journal-date">${j.date}</span>
            <span class="att-pill" style="background:${attColor2}20;color:${attColor2};border:1px solid ${attColor2}40">${attLabel}</span>
            ${j.unit ? `<span style="font-size:11px;color:#6b8a74;font-weight:600">📌 ${pEsc(j.unit)}</span>` : ''}
            ${nCmt ? `<span style="font-size:11px;color:#b7791f">💬 ${nCmt}</span>` : ''}
          </div>
          <div class="jfold-peek" style="font-size:12.5px;color:#8aa392;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${pEsc(peek)}${body0.length > 42 ? '…' : ''}</div>
          <div class="jfold-body" style="display:none">
          ${(function(){ const body = body0; return body ? `<div class="journal-content">${linkify(pEsc(body))}</div>` : ''; })()}
          ${journalAttachHtml(j)}
          ${j.feedback ? `<div class="journal-feedback">💬 ${j.feedback}</div>` : ''}
          <div style="margin-top:8px;border-top:1px dashed var(--green-line);padding-top:8px">
            ${(allJComments[j.id]||[]).map((c,ci)=>`<div style="font-size:12px;padding:3px 0;color:#4a6653"><b style="color:${c.by==='admin'?'var(--green-dark)':'#b7791f'}">${esc(c.name)}</b> ${esc(c.text)} <span style="color:#b0c4b6;font-size:10px">${fmtT(c.at)}</span>${pReactHtml(j.id, ci, c)}</div>`).join('')}
            <div style="display:flex;gap:6px;margin-top:4px">
              <input type="text" id="jc_${j.id}" placeholder="댓글 남기기..." onkeydown="if(event.key==='Enter')window.addJComment('${j.id}')" style="flex:1;background:var(--green-faint);border:1px solid var(--green-border);border-radius:7px;font-size:12px;padding:6px 10px">
              <button onclick="window.addJComment('${j.id}')" style="background:var(--green);border:none;border-radius:7px;color:#fff;font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer">등록</button>
            </div>
          </div>
          </div>
        </div>`;
      }).join('');
    } else {
      journalHtml = '<div class="empty-msg">수업일지가 없습니다.</div>';
    }
    setTimeout(watchJournalCards, 300);

    // 이번 달 메모
    const thisMonth = new Date().toISOString().slice(0,7);
    let memoHtml = '';
    Object.keys(allMemos).filter(dk=>dk.startsWith(thisMonth)).sort().reverse().forEach(dk => {
      const m = allMemos[dk][sid];
      if (m && m.trim()) memoHtml += `<div class="memo-item"><span class="memo-date">${dk}</span><span class="memo-text">${m}</span></div>`;
    });

    // 출결 게이지 SVG
    const pct = attRate || 0;
    const angle = 180 - (pct/100*180);
    const rad = a => a*Math.PI/180;
    const cx=100, cy=100, r=78;
    const x1=cx+r*Math.cos(rad(180)), y1=cy+r*Math.sin(rad(180));
    const x2=cx+r*Math.cos(rad(angle)), y2=cy+r*Math.sin(rad(angle));
    const large = pct>50?1:0;
    const gauge = `<svg viewBox="0 0 200 108" style="width:180px;height:108px">
      <path d="M22,100 A78,78 0 0,1 178,100" fill="none" stroke="var(--green-line)" stroke-width="14" stroke-linecap="round"/>
      ${pct>0?`<path d="M${x1},${y1} A78,78 0 ${large},1 ${x2},${y2}" fill="none" stroke="${attColor}" stroke-width="14" stroke-linecap="round"/>`:''}`
    + `<text x="100" y="86" text-anchor="middle" font-size="26" font-weight="700" fill="${attColor}" font-family="Space Mono">${attRate!==null?attRate+'%':'—'}</text>
      <text x="100" y="102" text-anchor="middle" font-size="11" fill="#6b8a74" font-family="Noto Sans KR">출석률</text>
    </svg>`;

    document.getElementById('dashboard').innerHTML = `
      <div class="student-hero">
        <div class="student-hero-name">${s.name} <span class="hero-grade">${s.grade||''}</span></div>
        <div class="student-hero-sub">${s.subject||''}</div>
        ${ddayChips(true)}
      </div>

      <div id="pViewHome">
      <div id="pViewJournal">
      <!-- 수업일지 -->
      <div class="dash-card" style="margin-bottom:14px">
        <div class="dash-card-title" id="pJournalTitle">📓 수업일지 <span style="color:#aaa;font-size:13px;font-weight:400">최근 10회 · 달력 날짜를 누르면 그날 일지만 보여요</span></div>
        <div class="journal-list" id="pJournalList">${journalHtml}</div>
      </div>

      ${memoHtml ? `
      <div class="dash-card" style="margin-top:16px">
        <div class="dash-card-title">💬 이번 달 수업 메모</div>
        <div class="memo-list">${memoHtml}</div>
      </div>` : ''}
      </div><!-- /pViewJournal -->
      <div class="dash-grid">
        <!-- 출결·일정 달력 카드 -->
        <div class="dash-card">
          <div class="dash-card-title" style="display:flex;justify-content:space-between;align-items:center">
            <span>📅 출결 · 학원 일정</span>
            <span style="display:flex;align-items:center;gap:6px">
              <button onclick="window.calShift(-1)" style="background:#fff;border:1px solid var(--green-border);border-radius:6px;color:var(--green);padding:1px 9px;cursor:pointer;font-size:13px">‹</button>
              <span id="pCalTitle" style="font-size:13px;font-weight:700;color:var(--green-dark)"></span>
              <button onclick="window.calShift(1)" style="background:#fff;border:1px solid var(--green-border);border-radius:6px;color:var(--green);padding:1px 9px;cursor:pointer;font-size:13px">›</button>
              <button onclick="window.calShift(0)" title="이번 달로" style="background:var(--green);border:none;border-radius:6px;color:#fff;padding:2px 9px;cursor:pointer;font-size:11px;font-weight:700">오늘</button>
            </span>
          </div>
          <div style="display:flex;gap:10px;margin-bottom:8px;font-size:11px;color:#6b8a74;flex-wrap:wrap">
            <span><b style="color:var(--green)">●</b> 출석</span>
            <span><b style="color:#b7791f">●</b> 지각</span>
            <span><b style="color:#e53e3e">●</b> 결석</span>
            <span><b style="color:#6a8fb8">●</b> 보강</span>
            <span><b style="color:#7c3aed">●</b> 학사일정</span><span><b style="color:#b8900f">●</b> 학원일정</span>
            <span><b style="color:#4a90d9">●</b> 공지</span>
          </div>
          <div id="pCalGrid"></div>
          <div id="pCalList" style="margin-top:10px"></div>
        </div>

        <!-- 성적 카드 -->
        <div class="dash-card">
          <div class="dash-card-title">📊 최근 성적</div>
          ${scoreRows || '<div class="empty-msg">기록된 성적이 없습니다.</div>'}
        </div>
      </div>

      <!-- 학습 진도 로드맵 -->
      ${rmParentCard(s.id)}

      <!-- 인강 진도 -->
      <div class="dash-card" id="pLectCard" style="margin-top:14px;display:none">
        <div class="dash-card-title">📺 인강 진도</div>
        <div id="pLectBox"></div>
      </div>

      <!-- 원장님과의 대화 -->
      <div class="dash-card" style="margin-bottom:14px">
        <div class="dash-card-title">💬 원장님과의 대화</div>
        <div id="pConvBox" style="display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto;margin-bottom:10px"></div>
        <div style="display:flex;gap:6px">
          <input type="text" id="pMsgInput" placeholder="메시지 입력..." onkeydown="if(event.key==='Enter')window.sendParentMessage()" style="flex:1;background:var(--green-faint);border:1px solid var(--green-border);border-radius:999px;font-family:inherit;font-size:14px;padding:10px 16px">
          <button onclick="window.sendParentMessage()" style="background:var(--green);border:none;border-radius:999px;color:#fff;font-size:14px;font-weight:700;padding:10px 22px;cursor:pointer">전송</button>
        </div>
      </div>
      </div><!-- /pViewHome -->

    `;
  }

  checkAppVersion();   // 새 버전이 있으면 스스로 다시 받는다
  loadAll();
</script>

<style>

  ::placeholder { font-weight: 400; }
  input[type="date"], input[type="number"] { font-family: 'Space Mono', monospace; font-weight:500; }
  .ptab { background:#fff; border:1px solid var(--green-border); border-radius:999px; color:#4a6653; font-family:inherit; font-size:14px; font-weight:500; padding:8px 18px; cursor:pointer; }
  .ptab.on { background:var(--green); border-color:var(--green); color:#fff; }
  /* 가독성: 세미볼드 + 크기 업 + 폰트 통일 */
  body, button, input, textarea, select { font-family: 'Haetsal', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  .section-label { font-family: 'Haetsal', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif !important; font-size: 19px !important; font-weight:500; color: var(--green-dark); }
  .journal-content { font-size: 15px !important; line-height: 1.7; }
  .journal-feedback { font-size: 14px !important; }
  .dash-card { font-size: 14px; }
  .dash-card-title { font-size: 16px !important; }
  .empty-msg { font-size: 14px; }
  /* ── 글자 굵기: 세미볼드(600) 상한 ── */
  body { font-weight: 500; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  html { font-size: 16.5px; }
  [style*="font-weight:700"], [style*="font-weight: 700"],
  [style*="font-weight:800"], [style*="font-weight: 800"],
  [style*="font-weight:900"], [style*="font-weight: 900"] { font-weight: 600 !important; }
  b, strong { font-weight:600; }
  /* ── 본문 미디엄(500) + 크기 업 · 로그인 창은 세미볼드 유지 ── */
  [style*="font-weight:600"], [style*="font-weight: 600"] { font-weight: 600 !important; }
  #loginSection, #loginSection * { font-weight: 600 !important; }
  .journal-content { font-size: 16px !important; }
  .journal-feedback { font-size: 15px !important; }
  .dash-card { font-size: 14.5px; }
  .empty-msg { font-size: 14.5px; }
  /* ── 손글씨 폰트 받침 잘림 완전 방지 (모든 브라우저) ── */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { line-height: 1.6 !important; }
  input, textarea, select, button { line-height: 1.5 !important; }
  .modal-title, .dash-card-title, .section-label, .home-card-title, .section-title,
  h1, h2, h3, label, .tg-label, .student-name, .journal-content, .notice-content {
    line-height: 1.6 !important; padding-bottom: 2px;
  }
  /* 입력칸: 위아래 여백 확보해 받침 안 잘리게 */
  input[type="text"], input[type="password"], input[type="date"], input[type="time"], input[type="number"], textarea, select {
    padding-top: 10px !important; padding-bottom: 10px !important; min-height: 1.5em;
  }
</style>

  /* zoom 을 끄면 가는 획이 안 사라진다 (모든 브라우저 공통).
     1.12 배는 정수 배율이 아니라서 ㅡ, ㅛ 밑받침 같은 가는 가로획이
     픽셀 사이에 걸치면 렌더러가 통째로 버린다. 대신 글자를 키워 보정. */
  /* 얇은 가로획(ㄴ 받침, ㅗ 등)이 픽셀 격자에 눌려 사라지지 않도록
     힌팅/격자정렬 대신 정밀 윤곽선으로 그리게 한다. 폰트의 gasp 도 함께 수정됨. */
  * { text-rendering: geometricPrecision; }
  body { zoom: 1 !important; -webkit-font-smoothing: antialiased; }
  /* ★ 가는 획 살리기 — 최종 수단.
     ㄴ 받침·ㅗ 의 가로획은 두께가 1.1px 밖에 안 돼서, 픽셀 경계에 걸리면
     래스터라이저가 0 으로 반올림해 획을 통째로 버린다.
     모든 획을 0.3px 씩 둘러 그려 두께를 1.7px 이상으로 올리면
     반올림으로 사라지는 일이 물리적으로 불가능해진다. */
  /* 획 보강용 text-shadow 는 전부 걷어냈다.
     폰트 파일의 가로획을 직접 굵게(56→77단위, +38%) 만들었으므로
     CSS 로 덧칠할 필요가 없다. 덧칠은 글씨를 뭉툭하고 흐리게 만들 뿐이다. */


  body, .tab-btn, .ptab, input, textarea, select, button { font-size: 15px; }
</style>

<div class="container">
  <div id="loadingMsg">데이터를 불러오는 중...</div>

  <!-- 로그인 -->
  <div id="loginSection" style="display:none;max-width:380px;margin:30px auto 0">
    <div style="background:#fff;border:1px solid var(--green-border);border-radius:14px;padding:26px 24px;box-shadow:0 2px 12px rgba(47,105,71,.08)">
      <div style="text-align:center;font-size:17px;font-weight:800;color:var(--green-dark);margin-bottom:4px">학부모 로그인</div>
      <div style="text-align:center;font-size:13px;color:#6b8a74;margin-bottom:18px">자녀 정보로 로그인해 주세요</div>
      <div style="margin-bottom:10px">
        <label style="display:block;font-size:12px;color:#6b8a74;margin-bottom:4px">자녀 이름</label>
        <input type="text" id="pLoginName" placeholder="자녀 이름" style="width:100%;background:var(--green-faint);border:1px solid var(--green-border);border-radius:8px;font-size:15px;padding:10px 13px" onkeydown="if(event.key==='Enter')window.parentLogin()">
      </div>
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:12px;color:#6b8a74;margin-bottom:4px">비밀번호</label>
        <input type="password" id="pLoginPw" placeholder="자녀 계정 비밀번호" style="width:100%;background:var(--green-faint);border:1px solid var(--green-border);border-radius:8px;font-size:15px;padding:10px 13px" onkeydown="if(event.key==='Enter')window.parentLogin()">
      </div>
      <button onclick="window.parentLogin()" style="width:100%;background:var(--green);border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:700;padding:11px;cursor:pointer">로그인</button>
      <div id="pLoginErr" style="display:none;color:#e53e3e;font-size:12px;text-align:center;margin-top:8px"></div>
    </div>
  </div>

  <div id="searchSection" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="section-label" style="margin:0" id="pChildLabel"></span>
      <button onclick="window.parentLogout()" style="background:none;border:1px solid var(--green-border);border-radius:6px;color:#6b8a74;font-size:12px;padding:4px 10px;cursor:pointer">로그아웃</button>
    </div>
    <div id="pSiblingTabs" style="display:none;gap:7px;flex-wrap:wrap;margin:10px 0"></div>
    <div class="student-grid" id="studentBtns" style="display:none"></div>

    <!-- 새 소식 -->
    <div id="pNewsCard" style="display:none;margin-bottom:16px"></div>

    <!-- 공지사항 -->
    <div id="noticeSection" style="display:none;margin-bottom:16px">
      <div class="section-label">📢 공지사항</div>
      <div id="noticeList"></div>
    </div>

    <div id="pTabBar" style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;justify-content:center">
      <button class="ptab on" id="ptab_home" onclick="window.pTab('home')">🏠 홈</button>
      <button class="ptab" id="ptab_links" onclick="window.pTab('links')">🔗 유용한 링크</button>
    </div>

    <div id="dashboard"></div>
    <div id="pExamBox" style="margin-top:16px"></div>
  </div>
</div>


  <div id="linksSection" style="display:none;max-width:480px;margin:20px auto 0;padding:0 16px">
    <div class="section-label" style="font-size:11px;font-family:'Space Mono',monospace;color:#6b8a74;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px">🔗 유용한 링크</div>
    <div id="pLinksList" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>

});
