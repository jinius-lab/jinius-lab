<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JINIUS-LAB 로고 교체 도구</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0d1117;
    color: #e6edf3;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 48px;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 16px 48px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #c9a84c;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .sub {
    font-size: 13px;
    color: #7d8590;
    margin-bottom: 36px;
    line-height: 1.6;
  }
  .step {
    margin-bottom: 28px;
  }
  .step-label {
    font-size: 12px;
    font-weight: 600;
    color: #c9a84c;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .step-title {
    font-size: 15px;
    font-weight: 500;
    color: #e6edf3;
    margin-bottom: 10px;
  }
  .file-drop {
    border: 2px dashed #30363d;
    border-radius: 10px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #0d1117;
    position: relative;
  }
  .file-drop:hover, .file-drop.active {
    border-color: #c9a84c;
    background: #1a1f2e;
  }
  .file-drop input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .file-drop .icon { font-size: 28px; margin-bottom: 8px; }
  .file-drop .hint { font-size: 13px; color: #7d8590; }
  .file-drop .filename {
    font-size: 14px;
    color: #3fb950;
    font-weight: 600;
    margin-top: 4px;
  }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #b8922a, #c9a84c);
    color: #0d1117;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
    letter-spacing: -0.3px;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(201,168,76,0.3); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .status {
    margin-top: 20px;
    padding: 14px 18px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  .status.success { background: #0d2818; border: 1px solid #3fb950; color: #3fb950; }
  .status.error   { background: #2d0a0a; border: 1px solid #f85149; color: #f85149; }
  .status.info    { background: #0c1929; border: 1px solid #388bfd; color: #79c0ff; }
  .divider { border: none; border-top: 1px solid #21262d; margin: 32px 0; }
  .note {
    font-size: 12px;
    color: #7d8590;
    line-height: 1.7;
    background: #0d1117;
    border-radius: 8px;
    padding: 14px;
    border: 1px solid #21262d;
  }
  .note strong { color: #c9a84c; }
</style>
</head>
<body>
<div class="card">
  <h1>🦋 JINIUS-LAB 로고 교체</h1>
  <p class="sub">index.html 파일의 4번 이미지를 새 로고로 자동 교체해드립니다.<br>모든 작업은 내 브라우저에서만 이루어집니다.</p>

  <!-- Step 1 -->
  <div class="step">
    <div class="step-label">Step 1</div>
    <div class="step-title">GitHub에서 받은 index.html 파일 선택</div>
    <div class="file-drop" id="htmlDrop">
      <input type="file" accept=".html" id="htmlInput">
      <div class="icon">📄</div>
      <div class="hint">클릭해서 index.html 선택</div>
      <div class="filename" id="htmlName"></div>
    </div>
  </div>

  <!-- Step 2 -->
  <div class="step">
    <div class="step-label">Step 2</div>
    <div class="step-title">새 로고 이미지 선택 (로고7.png)</div>
    <div class="file-drop" id="imgDrop">
      <input type="file" accept="image/*" id="imgInput">
      <div class="icon">🖼️</div>
      <div class="hint">클릭해서 새 로고 이미지 선택</div>
      <div class="filename" id="imgName"></div>
    </div>
  </div>

  <button class="btn" id="runBtn" disabled>✨ 로고 교체하고 파일 다운로드</button>

  <div class="status" id="status"></div>

  <hr class="divider">
  <div class="note">
    <strong>📌 사용 후</strong><br>
    다운로드된 <code>index.html</code>을 GitHub 레포에 업로드하면 사이트에 바로 반영됩니다.
  </div>
</div>

<script>
let htmlFile = null;
let imgFile  = null;

function updateBtn() {
  document.getElementById('runBtn').disabled = !(htmlFile && imgFile);
}

document.getElementById('htmlInput').addEventListener('change', e => {
  htmlFile = e.target.files[0];
  document.getElementById('htmlName').textContent = htmlFile ? '✓ ' + htmlFile.name : '';
  updateBtn();
});

document.getElementById('imgInput').addEventListener('change', e => {
  imgFile = e.target.files[0];
  document.getElementById('imgName').textContent = imgFile ? '✓ ' + imgFile.name : '';
  updateBtn();
});

document.getElementById('runBtn').addEventListener('click', async () => {
  const btn = document.getElementById('runBtn');
  const status = document.getElementById('status');

  btn.disabled = true;
  btn.textContent = '⏳ 처리 중...';
  status.style.display = 'block';
  status.className = 'status info';
  status.textContent = 'HTML 파일 읽는 중...';

  try {
    // 1. HTML 읽기
    const htmlText = await htmlFile.text();

    // 2. 새 이미지 base64 변환
    status.textContent = '새 이미지 변환 중...';
    const imgB64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        // data:image/png;base64,XXXX → XXXX 부분만
        resolve(e.target.result);
      };
      reader.onerror = reject;
      reader.readAsDataURL(imgFile);
    });

    // 3. base64 이미지 찾기
    status.textContent = '이미지 교체 중...';
    const pattern = /data:image\/(jpeg|jpg|png|gif|webp);base64,[A-Za-z0-9+/=]+/g;
    const matches = [...htmlText.matchAll(pattern)];

    if (matches.length <= 4) {
      throw new Error(`이미지가 ${matches.length}개뿐이에요. 4번 이미지가 없습니다.`);
    }

    // 4번 이미지(index 4) 교체
    const target = matches[4][0];
    const newHtml = htmlText.replace(target, imgB64);

    // 4. 다운로드
    const blob = new Blob([newHtml], { type: 'text/html;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'index.html';
    a.click();
    URL.revokeObjectURL(url);

    status.className = 'status success';
    status.textContent = `✅ 완료! 총 ${matches.length}개 이미지 중 4번이 교체되었습니다. 다운로드를 확인하세요.`;
    btn.textContent = '✨ 로고 교체하고 파일 다운로드';
    btn.disabled = false;

  } catch (err) {
    status.className = 'status error';
    status.textContent = '❌ 오류: ' + err.message;
    btn.textContent = '✨ 로고 교체하고 파일 다운로드';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
