<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --green:#1c3a2b; --green2:#2f6244; --cream:#f7f4ef; --paper:#faf8f5;
  --gold:#c6a64f; --gold2:#e8c97e; --ink:#1a1814; --muted:#7a7570;
  --rule:rgba(26,24,20,0.1);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body {
  background:var(--cream); color:var(--ink);
  font-family:'Noto Serif KR', serif;
  -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center;
  padding:0 1rem 3rem;
}
.card { width:100%; max-width:440px; }

/* ===== HERO ===== */
.hero {
  background:linear-gradient(150deg, var(--green2) 0%, var(--green) 62%);
  color:var(--paper);
  border-radius:0 0 26px 26px;
  padding:3.4rem 1.9rem 2.6rem;
  text-align:center;
  position:relative; overflow:hidden;
  box-shadow:0 18px 44px rgba(28,58,43,0.22);
}
.hero::after {
  content:""; position:absolute; top:-90px; right:-70px;
  width:250px; height:250px; border-radius:50%;
  background:rgba(255,255,255,0.05);
}
.hero img { width:214px; max-width:72%; height:auto; display:block; margin:0 auto; position:relative; z-index:1; }
.tag {
  margin-top:1.7rem; font-family:'DM Mono',monospace;
  font-size:0.6rem; letter-spacing:0.28em; text-transform:uppercase;
  color:var(--gold2); position:relative; z-index:1;
}
.hero h1 {
  margin-top:0.85rem; font-family:'Cormorant Garamond',serif;
  font-weight:600; font-size:1.42rem; line-height:1.55;
  letter-spacing:0.01em; position:relative; z-index:1;
}
.hero h1 em { font-style:italic; color:var(--gold2); }
.hero p {
  margin-top:0.9rem; font-size:0.86rem; line-height:1.85;
  color:rgba(250,248,245,0.72); position:relative; z-index:1;
}

/* ===== BUTTONS ===== */
.stack { margin-top:1.5rem; display:flex; flex-direction:column; gap:0.6rem; }
.btn {
  display:flex; align-items:center; gap:0.9rem;
  padding:1rem 1.25rem;
  background:#fff; border:1px solid var(--rule); border-radius:14px;
  color:var(--ink); text-decoration:none;
  font-size:0.95rem; font-weight:500;
  transition:transform .18s, box-shadow .18s, border-color .18s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active { transform:scale(0.985); }
.btn:hover { border-color:var(--green); box-shadow:0 8px 20px rgba(28,58,43,0.08); }
.btn svg { width:19px; height:19px; flex:none; color:var(--green); }
.btn span { flex:1; }
.btn i {
  font-style:normal; font-family:'DM Mono',monospace;
  font-size:0.66rem; letter-spacing:0.08em; color:var(--muted);
}
.btn.primary {
  background:var(--green); border-color:var(--green); color:var(--paper);
}
.btn.primary svg { color:var(--gold2); }
.btn.primary i { color:rgba(250,248,245,0.6); }
.btn.gold {
  background:#fdf3d7; border-color:#e8d9a8;
}

.row { display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; }
.row .btn { justify-content:center; gap:0.55rem; font-size:0.9rem; }
.row .btn span { flex:none; }

.label {
  margin:1.9rem 0 0.75rem; padding-left:0.2rem;
  font-family:'DM Mono',monospace; font-size:0.6rem;
  letter-spacing:0.22em; text-transform:uppercase; color:var(--muted);
  display:flex; align-items:center; gap:0.7rem;
}
.label::after { content:""; flex:1; height:1px; background:var(--rule); }

/* ===== FOOT ===== */
.foot { margin-top:2.4rem; text-align:center; }
.foot .quote {
  font-family:'Cormorant Garamond',serif; font-style:italic;
  font-size:1.05rem; line-height:1.75; color:#3f6b4d;
}
.foot .meta {
  margin-top:1.1rem; font-family:'DM Mono',monospace;
  font-size:0.58rem; letter-spacing:0.14em; color:#b5b0a6; text-transform:uppercase;
}
.toast {
  position:fixed; left:50%; bottom:calc(2rem + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%) translateY(20px);
  background:var(--green); color:var(--paper);
  padding:0.72rem 1.4rem; border-radius:999px;
  font-size:0.82rem; opacity:0; pointer-events:none;
  transition:opacity .25s, transform .25s; z-index:50;
}
.toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --cream:#14120f; --ink:#ece7dd; --rule:rgba(255,255,255,0.1); --muted:#8d8880; }
  :root:not([data-theme="light"]) .btn { background:#1e1b17; }
  :root:not([data-theme="light"]) .btn.gold { background:#2a2317; border-color:#4a3d23; }
  :root:not([data-theme="light"]) .foot .quote { color:#7fae92; }
}
</style>

<script>
document.getElementById('copy').addEventListener('click', function () {
  var url = 'https://jlnahbi.kr/card/';
  var show = function () {
    var t = document.getElementById('toast');
    t.classList.add('on');
    setTimeout(function () { t.classList.remove('on'); }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(show).catch(function () { fallback(url, show); });
  } else { fallback(url, show); }
});
function fallback(url, done) {
  var i = document.createElement('textarea');
  i.value = url; i.setAttribute('readonly', '');
  i.style.position = 'fixed'; i.style.left = '-9999px';
  document.body.appendChild(i); i.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(i);
}
</script>
