  import { getDatabase, ref, get as __rawGet, set, push, onValue as __rawOnValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  /* ── Firebase에서 읽는 모든 데이터를 NFC로 정규화 (한글 자모 분리 방지) ── */
  const __nfcDeep = (v) => {
    if (typeof v === 'string') { try { return v.normalize('NFC'); } catch(e) { return v; } }
    if (Array.isArray(v)) return v.map(__nfcDeep);
    if (v && typeof v === 'object') { const o = {}; for (const k in v) if (Object.prototype.hasOwnProperty.call(v,k)) o[k] = __nfcDeep(v[k]); return o; }
    return v;
  };
  const __wrapSnap = (snap) => ({ exists: () => snap.exists(), val: () => __nfcDeep(snap.val()), key: snap.key });
  const get = (r) => __rawGet(r).then(__wrapSnap);
  const onValue = (r, cb, ...rest) => __rawOnValue(r, (snap) => cb(__wrapSnap(snap)), ...rest);

    r.style.setProperty('--green',t.green);
    r.style.setProperty('--green-dark',/^#[0-9a-fA-F]{6}$/.test(t.dark||'')?t.dark:t.green);
    r.style.setProperty('--green-bg',rgba(t.green,0.08));

  }

  /* 일정 공개대상 판정 (배열/객체/문자열 호환) */
  function calHasStudent(e) {
    const tg = e && e.targets;
    // 대상 미지정 옛 일정: 학사일정만 공개, 나머지는 숨김
    if (tg === null || tg === undefined) return (e && e.type === 'academic');
    if (Array.isArray(tg)) return tg.indexOf('student') !== -1;
    if (typeof tg === 'string') return tg.split(',').indexOf('student') !== -1;
    if (typeof tg === 'object') return tg['student'] === true;
    return true;
  }

  /* 서버 최신본과 합쳐 저장 - 통째로 덮어쓰면 그 사이 온 메시지가 사라진다 */
  async function saveMessagesMerged(local) {
    try {
      const snap = await get(ref(db, 'messages'));
      let server = asArr(snap.exists() ? snap.val() : []);
      const byId = {};
      server.forEach(function(m){ if (m && m.id) byId[m.id] = m; });
      (local || []).forEach(function(m){
        if (!m || !m.id) return;
        const prev = byId[m.id];
        byId[m.id] = prev ? Object.assign({}, prev, m, { read: !!(prev.read || m.read), readAt: m.readAt || prev.readAt }) : m;
      });
      const merged = Object.keys(byId).map(function(k){ return byId[k]; })
        .sort(function(a,b){ return String(a.createdAt||'').localeCompare(String(b.createdAt||'')); });
      await set(ref(db, 'messages'), merged);   // ← 여기서 자기 자신을 부르면 무한 재귀가 된다
      return merged;
    } catch(e) { console.error(e); return local; }
  }

  /* Firebase 는 중간 인덱스가 비면 배열을 객체로 돌려준다.
     Array.isArray 만 보면 그 순간부터 메시지가 통째로 안 보인다. */
  function asArr(v) {
    if (!v) return [];
    return Array.isArray(v) ? v.filter(Boolean) : Object.values(v).filter(Boolean);
  }

  /* 30일 자동 로그인: 저장 시각을 함께 남기고, 지나면 다시 로그인 */
  const LOGIN_DAYS = 30;
  function loginStillValid() {
    try {
      const t = parseInt(localStorage.getItem('jinius_student_login_at') || '0', 10);
      if (!t) { localStorage.setItem('jinius_student_login_at', String(Date.now())); return true; }  // 예전 로그인 호환
      if (Date.now() - t > LOGIN_DAYS*24*60*60*1000) {
        localStorage.removeItem('jinius_student_login'); localStorage.removeItem('jinius_student_login_at');
        localStorage.removeItem('jinius_student_login_at');
        return false;
      }
      return true;
    } catch(e) { return true; }
  }
  function dateKey(d) { const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }

  function noticeAttachHtml(n) {

  async function renderPlannerTab(el) {
    el.innerHTML = '<div class="section-label">내 플래너</div><div style="text-align:center;color:#aaa;padding:20px;font-size:13px">불러오는 중...</div>';

      return;
    }
    // 앱 안 전체 화면으로 열기 (바깥 스크롤 잠금 → 흔들림 방지)
    el.innerHTML = '<div class="section-label">내 플래너</div>'
      + '<div class="jcard" style="text-align:center;padding:28px 16px">'
      + '<div style="font-size:40px;margin-bottom:10px">📔</div>'
      + '<div style="font-size:14px;color:#4a6653;margin-bottom:16px">' + currentStudent.name + '의 플래너</div>'
      + '<button onclick="window.openPlannerFull()" style="background:var(--green);border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:800;padding:14px 34px;cursor:pointer">플래너 열기</button>'
      + '<div style="font-size:11px;color:#a5bcac;margin-top:12px">앱 안에서 전체 화면으로 열려요</div>'
      + '</div>';
  }

  window.openPlannerFull = function() {
    const url = currentStudent.plannerUrl;
    if (!url) { showToast('플래너가 아직 연결되지 않았어요'); return; }
    // 패드·폰(터치 기기): 새 탭으로 직접 열기 — 드래그·색칠 100% 정상 작동
    if (navigator.maxTouchPoints > 1 || 'ontouchstart' in window) {
      window.open(url, '_blank');
      return;
    }
    const ov = document.createElement('div');
    ov.id = 'plannerFull';
    ov.style.cssText = 'position:fixed;inset:0;z-index:99990;background:#fff;display:flex;flex-direction:column';
    ov.innerHTML = '<div style="flex-shrink:0;height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--green-dark);color:#fff">'
      + '<button onclick="window.closePlannerFull()" style="background:rgba(255,255,255,.15);border:none;border-radius:7px;color:#fff;font-size:13px;font-weight:700;padding:6px 13px;cursor:pointer">← 포털로</button>'
      + '<span style="font-size:13px;font-weight:700">📔 ' + currentStudent.name + '의 플래너</span>'
      + '</div>'
      + '<div style="flex:1;position:relative;overflow:hidden;overscroll-behavior:none">'
      + '<iframe src="' + url + '" style="position:absolute;inset:0;width:100%;height:100%;border:none" allow="camera"></iframe>'
      + '</div>';
    document.body.appendChild(ov);
    // 바깥 페이지 스크롤 완전 잠금 (이중 스크롤 출렁임 차단)
    window._plScrollY = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top = (-window._plScrollY) + 'px';
    document.body.style.width = '100%';
    document.body.style.overflow = 'hidden';
    document.documentElement.style.overflow = 'hidden';
    document.documentElement.style.overscrollBehavior = 'none';
  };
  window.closePlannerFull = function() {
    const ov = document.getElementById('plannerFull');
    if (ov) ov.remove();
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    document.body.style.overflow = '';
    document.documentElement.style.overflow = '';
    document.documentElement.style.overscrollBehavior = '';
    window.scrollTo(0, window._plScrollY || 0);
  }

  async function renderLinksTab(el) {
    el.innerHTML = '<div class="section-label">유용한 링크</div><div style="text-align:center;color:#aaa;padding:20px;font-size:13px">불러오는 중...</div>';
    let links = [];
    try {
      const snap = await get(ref(db, 'customLinks'));
      if (snap.exists() && Array.isArray(snap.val())) links = snap.val();
    } catch(e){}
    let html = '<div class="section-label">유용한 링크</div>';

    links.forEach(function(l) {

        + '<div style="font-size:28px">' + (l.icon||'🔗') + '</div>'
        + '<div style="flex:1"><div style="font-size:15px;font-weight:700">' + l.title + '</div>'
        + (l.desc ? '<div style="font-size:12px;color:#6b8a74;margin-top:2px">' + l.desc + '</div>' : '') + '</div>'
        + '<a href="' + l.url + '" target="_blank" style="background:var(--green);border:none;border-radius:8px;color:#fff;font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 16px;cursor:pointer;text-decoration:none;white-space:nowrap">열기 →</a>'
        + '</div>';
    });
    el.innerHTML = html;
  }

  function fmtT(iso) {
    if (!iso) return '';
    if (iso.length <= 10) return iso.slice(5); // 날짜만 있으면 그대로
    const d = new Date(iso);
    if (isNaN(d)) return iso.slice(5,16).replace('T',' ');
    const p = function(n){ return String(n).padStart(2,'0'); };
    return p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ── 한글 자모 분리(NFD) 방지: 저장·표시 모두 NFC로 통일 ── */
  function nfc(v) {
    if (typeof v === 'string') { try { return v.normalize('NFC'); } catch(e) { return v; } }
    if (Array.isArray(v)) { for (var i=0;i<v.length;i++) v[i] = nfc(v[i]); return v; }
    if (v && typeof v === 'object') { for (var k in v) if (Object.prototype.hasOwnProperty.call(v,k)) v[k] = nfc(v[k]); return v; }
    return v;
  }
  /* 입력 즉시 NFC로 (한글 조합 중에는 건드리지 않음) */
  /* 조합 끝/붙여넣기 시점에도 NFC 정규화 (타이핑 중 자모 분리 방지) */
function __nfcFix(t) {
  if (!t || (t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA')) return;
  if (t.tagName === 'INPUT' && /^(file|checkbox|radio|range|color|date|datetime-local|month|week|time|number|hidden|submit|button|image|reset)$/i.test(t.type)) return;
  var v = t.value; if (typeof v !== 'string' || !v) return;
  var n; try { n = v.normalize('NFC'); } catch(e) { return; }
  if (n !== v) { var p = t.selectionStart; t.value = n; try { t.setSelectionRange(p, p); } catch(e2) {} }
}
document.addEventListener('compositionend', function(e){ __nfcFix(e.target); }, true);
document.addEventListener('paste', function(e){ var t=e.target; setTimeout(function(){ __nfcFix(t); }, 0); }, true);
document.addEventListener('blur', function(e){ __nfcFix(e.target); }, true);
document.addEventListener('input', function(e) {
    var t = e.target;
    if (!t || (t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA')) return;
    if (t.tagName === 'INPUT' && /^(file|checkbox|radio|range|color|date|datetime-local|month|week|time|number|hidden|submit|button|image|reset)$/i.test(t.type)) return;
    if (e.isComposing || t.composing) return;
    var v = t.value;
    if (typeof v !== 'string' || !v) return;
    var n;
    try { n = v.normalize('NFC'); } catch(err) { return; }
    if (n !== v) {
      var p = t.selectionStart;
      t.value = n;
      try { t.setSelectionRange(p, p); } catch(err2) {}
    }
  }, true);
  
    function esc(s) {
    return nfc(String(s == null ? '' : s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  /* ── 자료실 ── */
  let allLibrary = [];
  /* 학생 개인 영역: 나만 쓰고 나만 보는 칸 (Firebase studentPrivate/<내ID>) */
  let myPrivate = { cal: {}, school: { grade: '', term: '', cells: {} } };
  async function loadPrivate() {
    if (!currentStudent) return;
    try {
      const sp = await get(ref(db, 'studentPrivate/' + currentStudent.id));
      if (sp.exists()) {
        const v = sp.val() || {};
        myPrivate = {
          cal: v.cal || {},
          school: { grade: (v.school && v.school.grade) || '', term: (v.school && v.school.term) || '',
                    cells: (v.school && v.school.cells) || {} }
        };
      }
    } catch(e) { console.error(e); }
  }
  async function savePrivate() {
    if (!currentStudent) return;
    try { await set(ref(db, 'studentPrivate/' + currentStudent.id), myPrivate); }
    catch(e) { console.error(e); showToast('저장 실패'); }
  }
  let libFnUrl = '';
  function libOpenUrl(it) {
    if (!libFnUrl) return '';
    const tk = localStorage.getItem('jinius_student_token') || '';
    const sep = libFnUrl.indexOf('?') === -1 ? '?' : '&';
    return libFnUrl + sep + 'id=' + encodeURIComponent(it.id) + '&k=' + encodeURIComponent(tk);
  }
  const LIB_ICON_S = { answer:'🔑', print:'📄', exam:'📝', logo:'🎓', etc:'📎' };
  const LIB_CAT_S  = { answer:'빠른답지', print:'프린트·교재', exam:'모의고사·시험지', logo:'대학 로고', etc:'기타' };
  function fmtSizeS(b) {
    if (!b) return '';
    if (b < 1024) return b + 'B';
    if (b < 1048576) return Math.round(b/1024) + 'KB';
    return (b/1048576).toFixed(1) + 'MB';
  }
  function renderLibraryTab(el) {
    const myGrade = (currentStudent && currentStudent.grade) || '';
    const items = allLibrary
      .filter(function(it){ return it && it.targets && it.targets.student === true; })
      .filter(function(it){
        const gs = it.grades;
        if (Array.isArray(gs)) return gs.length === 0 || gs.indexOf(myGrade) !== -1;
        return !it.grade || it.grade === myGrade;
      })
      .sort(function(a,b){ return String(b.at||'').localeCompare(String(a.at||'')); });

    let html = '<div class="section-label">자료실</div>';
    if (!items.length) {
      html += '<div style="text-align:center;color:#aaa;padding:34px 0;font-size:14px">받을 수 있는 자료가 아직 없어요</div>';
      el.innerHTML = html; return;
    }
    html += '<div style="background:#fff;border:1px solid var(--green-border);border-radius:12px;padding:6px 14px">';
    items.forEach(function(it){
      html += '<div style="display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--green-line)">'
        + '<div style="font-size:21px;flex-shrink:0">' + (LIB_ICON_S[it.cat]||'📎') + '</div>'
        + '<div style="flex:1;min-width:0">'
        +   '<div style="font-size:14px;color:var(--green-dark);font-weight:500">' + esc(it.title||it.name||'') + '</div>'
        +   '<div style="font-size:11px;color:#8aa392;margin-top:2px">'
        +     (it.desc ? esc(it.desc) + ' · ' : '') + (LIB_CAT_S[it.cat]||'')
        +     (it.size ? ' · ' + fmtSizeS(it.size) : '')
        +     (it.at ? ' · ' + String(it.at).slice(0,10) : '') + '</div>'
        + '</div>'
        + (libFnUrl
            ? '<a href="' + esc(libOpenUrl(it)) + '" target="_blank" rel="noopener" style="flex-shrink:0;background:var(--green);color:#fff;border-radius:7px;font-size:12px;padding:6px 13px;text-decoration:none">열기</a>'
            : '<span style="font-size:11px;color:#c08a2e;flex-shrink:0">준비 중</span>')
        + '</div>';
    });
    html += '</div>';
    el.innerHTML = html;
  }

  async function renderMessagesTab(el) {
    // 내 메시지 로드
    let myMsgs = [];
    let allMsgs = [];
    let staffList = [];
    let myReplies = {};
    try {
      const snap = await get(ref(db, 'messages'));
      if (snap.exists()) {
        allMsgs = snap.val();
        myMsgs = allMsgs.filter(m => m.fromId === currentStudent.id);
      }
      try { const tSnap = await get(ref(db, 'teachers')); if (tSnap.exists() && Array.isArray(tSnap.val())) staffList = tSnap.val(); } catch(e){}
      const rSnap = await get(ref(db, 'messageReplies'));
      if (rSnap.exists()) myReplies = rSnap.val();
    } catch(e) {}

    const received = allMsgs.filter(m => m.fromStaff && m.toId === currentStudent.id).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    window._stuAllMsgs = allMsgs;

    // ★ 메시지 탭을 열면 = 읽은 것. 선생님 화면의 '안읽음'도 '읽음'으로 바뀐다
    (function markRead(){
      let changed = false;
      allMsgs.forEach(function(m){
        if (m && m.fromStaff && m.toId === currentStudent.id && !m.read) {
          m.read = true;
          m.readAt = new Date().toISOString();
          changed = true;
        }
      });
      if (changed) { try { saveMessagesMerged(allMsgs); } catch(e) { console.error(e); } }
    })();
    let html = '';
    if (received.length) {
      html += '<div class="section-label">\ud83d\udce5 받은 메시지</div>';
      received.forEach(m => {
        const unread = !m.read;
        html += '<div class="jcard" style="margin-bottom:10px;border-left:3px solid ' + (unread ? '#b8900f' : 'var(--green)') + '">'
          + '<div onclick="openStuMsg(' + JSON.stringify(m.id).replace(/"/g,'&quot;') + ')" style="cursor:pointer;display:flex;align-items:center;gap:8px">'
          + '<span style="font-size:18px">' + (unread ? '\ud83d\udce9' : '\ud83d\udcd6') + '</span>'

          + (unread ? '<span style="background:rgba(184,144,15,.15);color:#8a6a0c;font-size:11px;font-weight:600;border-radius:999px;padding:2px 10px">눌러서 읽기</span>' : '<span style="color:#a5bcac;font-size:11px">읽음</span>')
          + '</div>'
          + '<div id="stuMsgBody_' + m.id + '" style="display:none;font-size:15px;line-height:1.65;white-space:pre-wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--green-line)">' + esc(m.text) + '</div></div>';
      });
    }
    html += '<div class="section-label">선생님께 메시지</div>'
      + '<div class="jcard" style="margin-bottom:16px">'
      + '<textarea id="msgInput" placeholder="선생님께 전하고 싶은 말을 써주세요..." style="width:100%;min-height:100px;background:var(--green-faint);border:1px solid var(--green-border);border-radius:8px;color:#1a2e22;font-family:var(--sans);font-size:14px;padding:10px 12px;resize:vertical;line-height:1.6"></textarea>'
      + '<select id="msgToStaff" style="width:100%;background:var(--green-faint);border:1px solid var(--green-border);border-radius:8px;font-family:var(--sans);font-size:13px;padding:9px 12px;margin-top:8px">'
      + '<option value="">👑 원장님께</option>'
      + staffList.map(t => '<option value="' + t.id + '">' + (t.kind==='assistant'?'🧑‍💼 ':'👩‍🏫 ') + t.name + (t.kind==='assistant'?' 조교':' 선생님') + '께</option>').join('')
      + '</select>'
      + '<button onclick="sendStudentMessage()" style="width:100%;background:var(--green);border:none;border-radius:8px;color:#fff;font-family:var(--sans);font-size:14px;font-weight:600;padding:10px;cursor:pointer;margin-top:8px">💬 메시지 보내기</button>'
      + '</div>';

    // ── 받는 사람(원장/각 선생님)별 대화방으로 묶기 ──
    // 내가 보낸 메시지 + 받은 답장을 상대별로 통합
    const convMap = {};  // key: 상대 식별자
    /* 대화방은 '상대 직원'으로만 갈린다. 키는 admin 또는 선생님 ID.
       예전엔 fromStaffId 가 없으면 이름을 키로 써서 같은 선생님이 여러 방으로 쪼개졌다. */
    function staffKeyOf(m) {
      if (m.fromStaff) {                      // 나에게 온 것
        const sid = (m.fromStaffId || '').trim();
        if (sid) return sid;
        if (m.fromId === 'admin' || /원장/.test(m.fromName || '')) return 'admin';
        const nm = (m.fromName || '').replace(/\s*(원장|선생님|조교)\s*$/, '').trim();
        const t = (staffList || []).find(function(x){ return x.name === nm; });
        return t ? t.id : 'admin';
      }
      const to = (m.toStaffId || '').trim();  // 내가 보낸 것
      return to || 'admin';
    }
    /* 방 이름은 키에서만 뽑는다 (메시지 필드에서 뽑으면 이름이 뒤바뀐다) */
    function staffNameOf(key) {
      if (key === 'admin') return '원장님';
      const t = (staffList || []).find(function(x){ return x.id === key; });
      if (!t) return '선생님';
      return t.name + (t.kind === 'assistant' ? ' 조교' : ' 선생님');
    }

    // 내가 보낸 것
    myMsgs.forEach(function(m){
      const k = staffKeyOf(m);
      if (!convMap[k]) convMap[k] = { name: staffNameOf(k), items: [] };
      convMap[k].items.push({ mine:true, text:m.text, at:m.createdAt, read:m.read });
    });
    // 내가 받은 것
    allMsgs.filter(function(m){ return m.fromStaff && m.toId === currentStudent.id; }).forEach(function(m){
      const k = staffKeyOf(m);
      if (!convMap[k]) convMap[k] = { name: staffNameOf(k), items: [] };
      convMap[k].items.push({ mine:false, text:m.text, at:m.createdAt, name: staffNameOf(k) });
    });

    const convKeys = Object.keys(convMap);
    if (convKeys.length === 0) {
      html += '<div class="section-label">대화</div><div class="empty-msg">주고받은 메시지가 없습니다.</div>';
    } else {
      html += '<div class="section-label">대화</div>';
      // 최근 메시지 순으로 대화방 정렬
      convKeys.sort(function(a,b){
        const la = convMap[a].items[convMap[a].items.length-1] || {};
        const lb = convMap[b].items[convMap[b].items.length-1] || {};
        return (lb.at||'').localeCompare(la.at||'');
      });
      convKeys.forEach(function(k){
        const conv = convMap[k];
        conv.items.sort(function(a,b){ return (a.at||'').localeCompare(b.at||''); });
        let bubbles = '';
        conv.items.forEach(function(it){
          bubbles += '<div style="display:flex;justify-content:' + (it.mine?'flex-end':'flex-start') + '">'
            + '<div style="max-width:80%;border-radius:' + (it.mine?'12px 12px 3px 12px':'12px 12px 12px 3px') + ';padding:8px 12px;font-size:13px;line-height:1.55;white-space:pre-wrap;'
            + (it.mine?'background:var(--green);color:#fff':'background:var(--green-bg);color:#1a2e22') + '">'
            + (it.mine?'':'<div style="font-size:10px;font-weight:700;color:#b7791f;margin-bottom:2px">' + esc(it.name||'선생님') + '</div>')
            + esc(it.text)
            + '<div style="font-size:9px;opacity:.7;text-align:right;margin-top:2px">' + fmtT(it.at) + (it.mine ? (it.read ? ' · 읽음' : ' · 안읽음') : '') + '</div>'
            + '</div></div>';
        });
        html += '<div class="jcard" style="margin-bottom:12px">'
          + '<div style="font-size:13px;font-weight:800;color:var(--green-dark);margin-bottom:8px">💬 ' + esc(conv.name) + '</div>'
          + '<div style="display:flex;flex-direction:column;gap:5px;max-height:280px;overflow-y:auto">' + bubbles + '</div>'
          + '<div style="display:flex;gap:6px;margin-top:8px">'
          + '<input type="text" id="cr_' + k + '" placeholder="메시지 입력..." onkeydown="if(event.key===&quot;Enter&quot;)window.studentConvReply(&quot;' + k + '&quot;)" style="flex:1;background:var(--green-faint);border:1px solid var(--green-border);border-radius:7px;font-size:13px;padding:8px 12px">'
          + '<button onclick="window.studentConvReply(&quot;' + k + '&quot;)" style="background:var(--green);border:none;border-radius:7px;color:#fff;font-size:13px;font-weight:600;padding:8px 16px;cursor:pointer">전송</button>'
          + '</div></div>';
      });
      window._stuConvMap = convMap;
    }

    el.innerHTML = html;
  }

  async function sendStudentMessage() {
    const text = document.getElementById('msgInput').value.trim();
    if (!text) { showToast('내용을 입력하세요'); return; }
    const toSel = document.getElementById('msgToStaff');
    const toStaffId = toSel ? toSel.value : '';
    const toStaffName = toSel && toSel.selectedIndex >= 0 ? toSel.options[toSel.selectedIndex].text.replace(/^[^ ]+ /,'').replace(/께$/,'') : '원장님';
    const msg = {
      id: 'msg_' + Date.now(),
      fromId: currentStudent.id,
      fromName: currentStudent.name,
      toStaffId: toStaffId,
      toStaffName: toStaffName,
      text,
      read: false,
      createdAt: new Date().toISOString()
    };
    try {
      // Firebase에서 기존 메시지 로드 후 추가
      const snap = await get(ref(db, 'messages'));
      let msgs = [];
      if (snap.exists()) msgs = asArr(snap.val());
      msgs.push(msg);
      await saveMessagesMerged(msgs);
      showToast('메시지 전송 완료 ✓');
      document.getElementById('msgInput').value = '';
      renderTab('messages');
    } catch(e) {
      showToast('전송 실패: ' + e.message);
    }
  }

  }

  async function login() {
    const name = document.getElementById('loginName').value.trim();
    const grade = document.getElementById('loginGrade').value;
    if (!name) { showLoginError('이름을 입력하세요'); return; }
    try {
      const snap = await get(ref(db, 'jinius/students'));
      if (!snap.exists()) { showLoginError('학생 정보 없음'); return; }
      const students = snap.val() || [];
      const pw = document.getElementById('loginPw').value.trim();
    const found = students.find(s => s.name === name && (!grade || s.grade === grade) && (s.pw === pw || (!s.pw && pw === name)));
      if (!found) { showLoginError('이름, 학년 또는 비밀번호가 맞지 않습니다'); return; }
      currentStudent = found;
      localStorage.setItem('jinius_student_login_at', String(Date.now())); localStorage.setItem('jinius_student_login', JSON.stringify(found));
      issueAutoToken(found.id);
      // 로그인 시간 기록 (최근 30회 보관)
      try {
        const lgSnap = await get(ref(db, 'loginLogs/' + found.id));
        const logs = (lgSnap.exists() && Array.isArray(lgSnap.val())) ? lgSnap.val() : [];
        logs.push(new Date().toISOString());
        set(ref(db, 'loginLogs/' + found.id), logs.slice(-30)).catch(function(){});
      } catch(e){}
      await loadData();
      showDashboard();
    } catch(e) { showLoginError('오류: ' + e.message); }
  }

    try { const cSnap = await get(ref(db, 'calEvents')); if (cSnap.exists()) allCalEvents = cSnap.val()||{}; } catch(e){}

  // ── 앱 아이콘 빨간 숫자 뱃지 (안 읽은 메시지 + 안 한 과제 개수) ──
  function countNewsStudent() {
    const msgs = window._stuAllMsgs || [];
    const unreadMsg = msgs.filter(function(m){ return m.fromStaff && m.toId === currentStudent.id && !m.read; }).length;
    const undoneTask = (myTasks||[]).filter(function(t){ return !t.done; }).length;
    // 오늘 공지
    const today = dateKey(new Date());
    const todayNotice = (allNotices||[]).filter(function(n){
      const forMe = n.targets ? n.targets.includes('student') : (n.target==='all'||n.target==='student');
      return forMe && (n.date===today || (n.createdAt||'').slice(0,10)===today);
    }).length;
    return { msg: unreadMsg, task: undoneTask, notice: todayNotice, total: unreadMsg + undoneTask + todayNotice };
  }
  function updateAppBadge() {
    try {
      const n = countNewsStudent().total;
      if (navigator.setAppBadge) { n>0 ? navigator.setAppBadge(n) : navigator.clearAppBadge(); }
    } catch(e){}
  }

  /* ═══════ GPS 출석 체크 ═══════ */
  let geoAtt = { on:false, lat:null, lng:null, radius:120, onTime:'19:00', lateUntil:'22:00', accSlack:20, accMax:120 };
  function distM(a1, o1, a2, o2) {              // 하버사인
    const R = 6371000, r = Math.PI/180;
    const dA = (a2-a1)*r, dO = (o2-o1)*r;
    const x = Math.sin(dA/2)**2 + Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dO/2)**2;
    return 2*R*Math.asin(Math.sqrt(x));
  }
  function hhmmNow() {
    const d = new Date();
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  function geoAttCard() {
    if (!geoAtt.on || geoAtt.lat === null || geoAtt.lat === undefined) return '';
    const dk = dateKey(new Date());
    const cur = (allAttendance && allAttendance[dk] && allAttendance[dk][currentStudent.id]) || null;
    const now = hhmmNow();
    let label, sub, done = false;
    if (cur === 'O')      { label = '오늘 출석 완료 ✓'; sub = '좋아요, 오늘도 화이팅!'; done = true; }
    else if (cur === 'L') { label = '오늘 지각 처리됨';  sub = '다음엔 조금만 더 일찍!'; done = true; }
    else if (cur === 'X') { label = '오늘 결석';         sub = '선생님께 문의해 주세요'; done = true; }
    else if (now > (geoAtt.lateUntil || '22:00')) { label = '체크 시간이 지났어요'; sub = '선생님께 말씀드려 주세요'; done = true; }
    else { label = '출석 체크'; sub = (now > (geoAtt.onTime || '19:00')) ? '지금 누르면 지각으로 기록돼요' : '학원에 도착하면 눌러주세요'; }
    return '<div class="home-card" style="text-align:center">'
      + '<div class="home-card-title" style="justify-content:center">📍 오늘 출결</div>'
      + '<div style="font-size:15px;font-weight:700;color:var(--green-dark);margin:4px 0 2px">' + label + '</div>'
      + '<div style="font-size:12px;color:#8aa392;margin-bottom:' + (done ? '2' : '10') + 'px">' + sub + '</div>'
      + (done ? '' : '<button id="geoBtn" onclick="window.doGeoCheck()" style="background:var(--green);border:none;border-radius:10px;color:#fff;font-family:inherit;font-size:15px;font-weight:700;padding:11px 30px;cursor:pointer">체크하기</button>')
      + '</div>';

  window.doGeoCheck = function() {
    const btn = document.getElementById('geoBtn');
    if (!navigator.geolocation) { showToast('이 브라우저는 위치를 지원하지 않아요'); return; }
    if (btn) { btn.disabled = true; btn.textContent = '위치 확인 중...'; }
    navigator.geolocation.getCurrentPosition(async function(pos){
      const acc = pos.coords.accuracy || 0;
      const accMax = (geoAtt.accMax === undefined ? 120 : geoAtt.accMax);
      // 신호가 너무 나쁘면 판단 자체를 거부한다 (되는 척 통과시키면 안 됨)
      if (accMax > 0 && acc > accMax) {
        if (btn) { btn.disabled = false; btn.textContent = '체크하기'; }
        showToast('위치 신호가 약해요 (오차 ' + Math.round(acc) + 'm). 창가에서 다시 눌러주세요');
        return;
      }
      const d = distM(pos.coords.latitude, pos.coords.longitude, geoAtt.lat, geoAtt.lng);
      const slack = (geoAtt.accSlack === undefined ? 20 : geoAtt.accSlack);
      const allow = (geoAtt.radius || 120) + Math.min(acc, slack);
      if (d > allow) {
        if (btn) { btn.disabled = false; btn.textContent = '체크하기'; }
        showToast('학원에서 눌러주세요 (약 ' + Math.round(d) + 'm 떨어져 있어요)');
        return;
      }
      const now = hhmmNow();
      const val = (now <= (geoAtt.onTime || '19:00')) ? 'O' : 'L';
      const dk = dateKey(new Date());
      try {
        // ※ 좌표는 저장하지 않는다. 출결 값과 시각만 남긴다.
        await set(ref(db, 'jinius/attendance/' + dk + '/' + currentStudent.id), val);
        await set(ref(db, 'attendanceLog/' + dk + '/' + currentStudent.id), { at: new Date().toISOString(), by: 'gps', val: val });
        if (!allAttendance[dk]) allAttendance[dk] = {};
        allAttendance[dk][currentStudent.id] = val;
        showToast(val === 'O' ? '출석 완료 ✓' : '지각으로 기록됐어요');
        renderTab('home');
      } catch(e) {
        console.error(e);
        if (btn) { btn.disabled = false; btn.textContent = '체크하기'; }
        showToast('저장 실패 - 인터넷을 확인해 주세요');
      }
    }, function(err){
      if (btn) { btn.disabled = false; btn.textContent = '체크하기'; }
      showToast(err.code === 1 ? '위치 권한을 허용해 주세요' : '위치를 못 읽었어요. 창가에서 다시 시도해 보세요');
    }, { enableHighAccuracy:true, timeout:12000, maximumAge:0 });
  };

// ─── 이미지 조절 창 (끌어서 위치, 슬라이더로 크기) ───
window.openImageCropper = function openImageCropper(file, outSize, onDone) {
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = function() {
    URL.revokeObjectURL(url);
    const PV = 260;
    const ov = document.createElement('div');
    ov.id = 'imgCropOverlay';
    ov.style.cssText = 'position:fixed;inset:0;z-index:99995;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px';
    ov.innerHTML = '<div style="background:#fff;border-radius:16px;padding:20px;width:100%;max-width:340px" id="cropBox">'
      + '<div style="font-size:15px;font-weight:800;color:#2f6947;margin-bottom:4px">🖼️ 로고 위치·크기 조절</div>'
      + '<div style="font-size:11px;color:#8aa392;margin-bottom:10px">끌어서 옮기고, 아래 막대로 크기를 조절하세요</div>'
      + '<canvas id="cropCanvas" width="'+PV+'" height="'+PV+'" style="width:'+PV+'px;height:'+PV+'px;border-radius:14px;border:2px dashed #d4e4d8;background:#fff;touch-action:none;cursor:grab;display:block;margin:0 auto"></canvas>'
      + '<input type="range" id="cropZoom" min="30" max="300" value="100" style="width:100%;margin:14px 0 4px;accent-color:#3d8a5e">'
      + '<div style="display:flex;justify-content:space-between;font-size:10px;color:#a5bcac;margin-bottom:12px"><span>작게</span><span>크게</span></div>'
      + '<div style="display:flex;gap:8px;justify-content:flex-end">'
      + '<button id="cropCancel" style="background:#fff;border:1px solid #d4e4d8;border-radius:8px;color:#6b8a74;font-family:inherit;font-size:14px;padding:9px 16px;cursor:pointer">취소</button>'
      + '<button id="cropOk" style="background:#3d8a5e;border:none;border-radius:8px;color:#fff;font-family:inherit;font-size:14px;font-weight:700;padding:9px 22px;cursor:pointer">✓ 적용</button>'
      + '</div></div>';
    document.body.appendChild(ov);

    const cv = document.getElementById('cropCanvas');
    const ctx = cv.getContext('2d');
    // 초기: 이미지가 틀에 꽉 차게(contain) 중앙 배치
    const base = Math.min(PV/img.width, PV/img.height);
    let zoom = 1, ox = 0, oy = 0; // 배율(기본 대비), 중심 오프셋
    function draw() {
      ctx.clearRect(0,0,PV,PV);
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,PV,PV);
      const w2 = img.width*base*zoom, h2 = img.height*base*zoom;
      ctx.drawImage(img, PV/2 - w2/2 + ox, PV/2 - h2/2 + oy, w2, h2);
    }
    draw();
    document.getElementById('cropZoom').oninput = function(){ zoom = this.value/100; draw(); };
    let drag=null;
    cv.addEventListener('pointerdown', function(e){ drag={x:e.clientX-ox, y:e.clientY-oy}; cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing'; });
    cv.addEventListener('pointermove', function(e){ if(!drag) return; ox=e.clientX-drag.x; oy=e.clientY-drag.y; draw(); });
    cv.addEventListener('pointerup', function(){ drag=null; cv.style.cursor='grab'; });
    document.getElementById('cropCancel').onclick = function(){ ov.remove(); };
    ov.onclick = function(e){ if(e.target===ov) ov.remove(); };
    document.getElementById('cropOk').onclick = function() {
      const out = document.createElement('canvas');
      out.width = outSize; out.height = outSize;
      const octx = out.getContext('2d');
      octx.fillStyle = '#fff'; octx.fillRect(0,0,outSize,outSize);
      const k = outSize / PV;
      const w2 = img.width*base*zoom*k, h2 = img.height*base*zoom*k;
      octx.drawImage(img, outSize/2 - w2/2 + ox*k, outSize/2 - h2/2 + oy*k, w2, h2);
      ov.remove();
      onDone(out.toDataURL('image/png'));
    };
  };
  img.onerror = function(){ alert('이미지를 읽을 수 없어요'); };
  img.src = url;
}

    if (fileInput.files && fileInput.files[0]) {
      const f = fileInput.files[0];
      const img = new Image();
      const url = URL.createObjectURL(f);
      img.onload = function() {
        const MAX = 240;
        let w2 = img.width, h2 = img.height;
        if (w2 > MAX || h2 > MAX) { const r = Math.min(MAX/w2, MAX/h2); w2 = Math.round(w2*r); h2 = Math.round(h2*r); }
        const cv = document.createElement('canvas'); cv.width = w2; cv.height = h2;
        cv.getContext('2d').drawImage(img, 0, 0, w2, h2);
        URL.revokeObjectURL(url);
        finish(cv.toDataURL('image/png'));

      img.src = url;

    el.textContent = pad(h)+':'+pad(m)+':'+pad(s);
  }
  function pad(n) { return String(n).padStart(2,'0'); }
  function fmtSec(s) { const h=Math.floor(s/3600),m=Math.floor((s%3600)/60); return h>0?h+'시간 '+m+'분':m+'분'; }

  window.timerToggle = function() {

      const st=document.getElementById('timerSt'); if(st)st.textContent='일시정지';

      timerInterval=setInterval(()=>{timerSec++;updateTimerUI();},1000); timerRunning=true;
      const b=document.getElementById('timerToggleBtn'); if(b)b.textContent='⏸ 일시정지';
      const st=document.getElementById('timerSt'); if(st)st.textContent='측정 중...';
    }
  };

  window.timerReset = function() {

  async function loadTimerRecs() {

    if(!snap.exists()){el.innerHTML='<div class="empty-msg">오늘 기록 없음</div>';return;}
    const recs=Object.values(snap.val());
    const total=recs.reduce((a,r)=>a+r.seconds,0);
    el.innerHTML=recs.map(r=>'<div class="timer-log-row"><span>'+new Date(r.savedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+'</span><span style="color:var(--green);font-weight:700">'+fmtSec(r.seconds)+'</span></div>').join('')+'<div class="timer-total">오늘 총 순공: <strong>'+fmtSec(total)+'</strong></div>';
  }

  function renderNoticeTab(el) {
    const visible=allNotices.filter(n=>n.targets?n.targets.includes('student'):(n.target==='all'||n.target==='student')).sort((a,b)=>((b.pinned?1:0)-(a.pinned?1:0)) || (b.createdAt||'').localeCompare(a.createdAt||''));
    let html='<div class="section-label">공지사항</div>';
    if(visible.length===0){html+='<div class="empty-msg">공지사항이 없습니다.</div>';el.innerHTML=html;return;}
    visible.forEach(n=>{html+='<div class="ncard"><div class="nc-hd"><span class="nc-title">'+n.title+'</span><span class="nc-date">'+n.date+'</span></div><div class="nc-body">'+n.content+'</div></div>';});
    el.innerHTML=html;
  }

  function showToast(msg) {
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
  }


  /* ── 홈화면 앱 자동 로그인 토큰 ──
     iOS는 사파리와 홈화면 앱의 저장소가 분리돼 있어서, 로그인 상태가 안 넘어간다.
     로그인 성공 시 URL에 1회용 토큰을 심어두면 '홈 화면에 추가'가 그 주소째로 저장되고,
     앱으로 열었을 때 토큰을 보고 자동 로그인된다. */
  function makeToken() {
    return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  async function issueAutoToken(sid) {
    try {
      let tk = localStorage.getItem('jinius_student_token');
      if (!tk) { tk = makeToken(); localStorage.setItem('jinius_student_token', tk); }
      await set(ref(db, 'autoLogin/' + tk), { sid: sid, role: 'student', at: new Date().toISOString() });
      const u = new URL(location.href);
      u.searchParams.set('k', tk);
      history.replaceState({}, '', u.toString());
    } catch(e) { console.error(e); }
  }
  async function tokenLogin() {
    const tk = new URLSearchParams(location.search).get('k');
    if (!tk) return null;
    try {
      const snap = await get(ref(db, 'autoLogin/' + tk));
      if (!snap.exists()) return null;
      const rec = snap.val() || {};
      if (rec.role !== 'student' || !rec.sid) return null;
      const stSnap = await get(ref(db, 'jinius/students'));
      const list = (stSnap.exists() && stSnap.val()) || [];
      const found = (Array.isArray(list) ? list : Object.values(list)).find(x => x && x.id === rec.sid);
      if (!found) return null;
      localStorage.setItem('jinius_student_login_at', String(Date.now())); localStorage.setItem('jinius_student_login', JSON.stringify(found));
      localStorage.setItem('jinius_student_token', tk);
      return found;
    } catch(e) { console.error(e); return null; }
  }

  // 자동 로그인: 저장된 세션 → 없으면 URL 토큰
  (async function autoLogin() {
    const saved = (loginStillValid() ? localStorage.getItem('jinius_student_login') : null);
    if (saved) {
      try {
        currentStudent = JSON.parse(saved);
        await loadData();
        showDashboard();
        issueAutoToken(currentStudent.id);
        return;
      } catch(e) { console.error(e); }
    }
    const byToken = await tokenLogin();
    if (byToken) {
      try {
        currentStudent = byToken;
        await loadData();
        showDashboard();
        return;
      } catch(e) { console.error(e); }
    }
  })();

  window.loginSubmit=login;

  // 엔터키 이벤트
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    if (document.getElementById('loginSection').style.display !== 'none' || !currentStudent) {
      login();
    }
  });
  // 할일 입력 엔터는 렌더링 후 동적으로 처리 (addTask 함수에서)

  window.lectPlus = async function(i) {
    if (!myLects[i]) return;
    myLects[i].done = Math.min(myLects[i].total, (myLects[i].done||0) + 1);
    try { await set(ref(db, 'lectures/' + currentStudent.id), myLects); } catch(e){}
    const pct = Math.round(myLects[i].done / myLects[i].total * 100);
    showToast(pct >= 100 ? '🎉 완강 축하해요!!' : '📺 ' + myLects[i].done + '/' + myLects[i].total + '강 (' + pct + '%)');
    renderTab('journal');
  };
  let _msgSubDone = false;
  function subscribeStudentMessages() {
    if (_msgSubDone || !currentStudent) return;
    _msgSubDone = true;
    try {
      onValue(ref(db, 'messages'), function(snap) {
        const cur = document.querySelector('.tab-btn.active');
        // 메시지 탭을 보고 있으면 자동 갱신
        const el = document.getElementById('tabContent') || document.getElementById('content');
        try { window._stuAllMsgs = asArr(snap.val()); } catch(e) {}
        if (window._curTab === 'messages' && el) renderMessagesTab(el);
        else if (window._curTab === 'home' && el) renderHome(el);   // 안읽음 배지 갱신
      });
    } catch(e){}
  }
  window.openStuMsg = async function(mid) {
    const body = document.getElementById('stuMsgBody_' + mid);
    if (!body) return;
    const opened = body.style.display !== 'none';
    body.style.display = opened ? 'none' : 'block';
    if (!opened) {
      const m = (window._stuAllMsgs||[]).find(x => x.id === mid);
      if (m && !m.read) {
        m.read = true;
        m.readAt = new Date().toISOString();
        try { await set(ref(db, 'messages'), window._stuAllMsgs); } catch(e){}
      }
    }
  };
  window.logout=function(){
    const tk = localStorage.getItem('jinius_student_token');
    if (tk) { try { set(ref(db,'autoLogin/'+tk), null); } catch(e){} }
    localStorage.removeItem('jinius_student_login'); localStorage.removeItem('jinius_student_login_at');
    localStorage.removeItem('jinius_student_token');
    location.replace(location.pathname);
  };
</script>
